<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Account — Builder Wood</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    :root { --tap: 44px; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: hidden; }

    body {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    /* ---------- page shell ---------- */
    .auth-page {
      max-width: 480px; margin: 60px auto; padding: 30px;
      background: #fff; border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow-wrap: anywhere;
    }
    .header-main { flex-wrap: wrap; gap: 12px; }
    .header-main .catnav-quote { margin-left: auto; }
    @media (max-width: 480px) {
      .header-main .catnav-quote { margin-left: 0; padding: 8px 0; }
    }

    /* ---------- tabs ---------- */
    .auth-tabs {
      display: flex; border-bottom: 1px solid var(--line);
      margin-bottom: 24px; overflow-x: auto;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .auth-tabs::-webkit-scrollbar { display: none; }
    .auth-tab {
      flex: 1 0 auto; text-align: center; padding: 12px 6px;
      min-height: var(--tap); font-weight: 700; color: var(--muted);
      cursor: pointer; border-bottom: 2px solid transparent;
      white-space: nowrap; -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .auth-tab.active { color: var(--wood-med); border-bottom-color: var(--wood-med); }

    /* ---------- forms ---------- */
    .auth-form { display: none; }
    .auth-form.active { display: block; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px 12px;
      border: 1px solid var(--line-2); border-radius: 8px;
      font-family: inherit; font-size: 14px;
      background: #fff; color: var(--ink); outline: 0;
      transition: border-color .15s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--wood-med); }

    /* ---------- password field with eye toggle ---------- */
    .password-field { position: relative; }
    .password-field input { padding-right: 48px; }
    .password-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      line-height: 1;
    }
    .password-toggle:hover { color: var(--wood-med); background: var(--parchment); }
    .password-toggle:focus-visible { outline: 2px solid var(--wood-med); outline-offset: 2px; }

    /* ---------- forgot password link ---------- */
    .forgot-password-row {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 12px;
    }
    .forgot-password-link {
      font-size: 12.5px;
      color: var(--wood-med);
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-password-link:hover {
      color: var(--wood-dark);
      text-decoration: underline;
    }

    /* ---------- submit button ---------- */
    .submit-btn {
      width: 100%; min-height: 48px;
      background: var(--wood-med); color: #fff;
      padding: 14px; border: none; border-radius: 8px;
      font-weight: 700; font-size: 15px; cursor: pointer;
      margin-top: 10px; transition: background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .submit-btn:disabled { opacity: .65; cursor: not-allowed; }
    @media (hover: hover) { .submit-btn:hover:not(:disabled) { background: var(--wood-dark); } }

    .msg {
      margin-top: 15px; font-weight: 600; text-align: center;
      font-size: 14px; overflow-wrap: anywhere; min-height: 1.2em;
    }

    /* ---------- role selector ---------- */
    .role-selector { display: flex; gap: 10px; margin-bottom: 16px; }
    .role-option {
      flex: 1; min-height: 48px; padding: 12px;
      border: 1px solid var(--line-2); border-radius: 8px;
      text-align: center; cursor: pointer;
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent; user-select: none;
      transition: border-color .15s, background .15s, color .15s;
    }
    .role-option.active {
      border-color: var(--wood-med);
      background: var(--parchment); color: var(--wood-med);
    }
    @media (hover: hover) {
      .role-option:not(.active):hover { border-color: var(--wood-light); }
    }

    /* ---------- seller-only fields ---------- */
    .seller-fields {
      display: none;
      padding: 12px;
      background: var(--parchment);
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px dashed var(--line-2);
    }
    .seller-fields.show { display: block; }
    .seller-fields .form-group:last-child { margin-bottom: 0; }
    .seller-fields-note {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 12px;
      line-height: 1.5;
    }

    /* ---------- phones ---------- */
    @media (max-width: 600px) {
      .auth-page { margin: 20px 12px; padding: 22px 18px; border-radius: 12px; }
      .form-group input, .form-group select { font-size: 16px; }
    }
    @media (max-width: 420px) {
      .role-selector { flex-direction: column; }
      .auth-page { margin: 12px 8px; padding: 18px 14px; }
    }
    @media (max-width: 360px) {
      .auth-page { margin: 8px 4px; padding: 16px 12px; }
      .auth-tab { font-size: 13px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-main">
      <a class="brand" href="/">
        <span class="brand-mark">🪵</span>
        <span class="brand-text">Builder<em>Wood</em></span>
      </a>
      <a class="catnav-quote" href="/" style="padding:8px 0;color:var(--gold-2);font-weight:700;">← Back to shop</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-tabs" role="tablist">
      <div class="auth-tab active" id="tab-login" role="tab" aria-selected="true" tabindex="0">Sign In</div>
      <div class="auth-tab" id="tab-register" role="tab" aria-selected="false" tabindex="-1">Create Account</div>
    </div>

    <!-- LOGIN -->
    <form class="auth-form active" id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" name="username" required
               placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="password-field">
          <input id="login-password" type="password" name="password" required
                 autocomplete="current-password">
          <button type="button" class="password-toggle"
                  onclick="togglePassword('login-password', this)"
                  aria-label="Show password">👁</button>
        </div>
      </div>
      <div class="forgot-password-row">
        <a href="/forgot-password" class="forgot-password-link">Forgot password?</a>
      </div>
      <button type="submit" class="submit-btn">Log In</button>
      <div class="msg" id="login-msg" role="status" aria-live="polite"></div>
    </form>

    <!-- REGISTER -->
    <form class="auth-form" id="register-form" novalidate>
      <div class="form-group">
        <label>I am registering as:</label>
        <div class="role-selector">
          <div class="role-option active" data-role="customer" role="radio" aria-checked="true" tabindex="0">Buyer</div>
          <div class="role-option" data-role="seller" role="radio" aria-checked="false" tabindex="0">Seller</div>
        </div>
        <input type="hidden" name="role" id="role-input" value="customer">
      </div>

      <div class="form-group">
        <label for="reg-name">Full Name</label>
        <input id="reg-name" type="text" name="name" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" name="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="reg-phone">Phone Number</label>
        <input id="reg-phone" type="tel" name="phone_number" required autocomplete="tel">
      </div>

      <!-- Seller-only fields -->
      <div class="seller-fields" id="seller-fields">
        <p class="seller-fields-note">
          These details will appear on your seller profile. You can update them later.
        </p>
        <div class="form-group">
          <label for="reg-company">Company / Shop Name</label>
          <input id="reg-company" type="text" name="company_name"
                 placeholder="e.g. Mensah Timber" autocomplete="organization">
        </div>
        <div class="form-group">
          <label for="reg-location">Location</label>
          <input id="reg-location" type="text" name="location"
                 placeholder="e.g. Sokoban Wood Village, Kumasi" autocomplete="address-level2">
        </div>
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <div class="password-field">
          <input id="reg-password" type="password" name="password" required minlength="6"
                 autocomplete="new-password">
          <button type="button" class="password-toggle"
                  onclick="togglePassword('reg-password', this)"
                  aria-label="Show password">👁</button>
        </div>
      </div>

      <button type="submit" class="submit-btn">Create Account</button>
      <div class="msg" id="register-msg" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    'use strict';

    // --- Password eye toggle ---
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
        btn.setAttribute("aria-label", "Hide password");
      } else {
        input.type = "password";
        btn.textContent = "👁";
        btn.setAttribute("aria-label", "Show password");
      }
    }
    window.togglePassword = togglePassword;

    // --- Tabs ---
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const formLogin = document.getElementById("login-form");
    const formRegister = document.getElementById("register-form");

    function showTab(tab) {
      const isLogin = tab === "login";
      tabLogin.classList.toggle("active", isLogin);
      tabRegister.classList.toggle("active", !isLogin);
      tabLogin.setAttribute("aria-selected", String(isLogin));
      tabRegister.setAttribute("aria-selected", String(!isLogin));
      formLogin.classList.toggle("active", isLogin);
      formRegister.classList.toggle("active", !isLogin);
    }

    tabLogin.addEventListener("click", () => showTab("login"));
    tabRegister.addEventListener("click", () => showTab("register"));

    [tabLogin, tabRegister].forEach((el) => {
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          el.click();
        }
      });
    });

    if (window.location.search.includes("mode=register")) showTab("register");

    // --- Role selector ---
    const roleOptions = document.querySelectorAll(".role-option");
    const roleInput = document.getElementById("role-input");
    const sellerFields = document.getElementById("seller-fields");

    function selectRole(role) {
      roleOptions.forEach((o) => {
        const active = o.dataset.role === role;
        o.classList.toggle("active", active);
        o.setAttribute("aria-checked", String(active));
      });
      roleInput.value = role;

      // Show/hide seller fields based on selected role
      if (role === "seller") {
        sellerFields.classList.add("show");
      } else {
        sellerFields.classList.remove("show");
        // Clear seller fields when switching back to customer
        document.getElementById("reg-company").value = "";
        document.getElementById("reg-location").value = "";
      }
    }

    roleOptions.forEach((opt) => {
      opt.addEventListener("click", () => selectRole(opt.dataset.role));
      opt.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          selectRole(opt.dataset.role);
        }
      });
    });

    // --- Helpers ---
    function setMsg(el, text, colorVar) {
      el.textContent = text;
      el.style.color = colorVar || "inherit";
    }

    async function parseJsonSafe(res) {
      try { return await res.json(); } catch { return {}; }
    }

    // --- Login ---
    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const msg = document.getElementById("login-msg");
      const btn = form.querySelector(".submit-btn");

      if (!form.username.value.trim() || !form.password.value) {
        setMsg(msg, "Enter your email and password.", "var(--red)");
        return;
      }

      btn.disabled = true;
      setMsg(msg, "Logging in...", "var(--wood-med)");

      const body = new URLSearchParams();
      body.append("username", form.username.value.trim());
      body.append("password", form.password.value);

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });
        const data = await parseJsonSafe(res);

        if (res.ok && data.access_token) {
          localStorage.setItem("bw_token", data.access_token);
          localStorage.setItem("bw_role", data.role || "");
          localStorage.setItem("bw_name", data.name || "");
          localStorage.setItem(
            "bw_user_id",
            data.user_id != null ? String(data.user_id) : ""
          );

          setMsg(msg, "Login successful! Redirecting...", "var(--green)");
          setTimeout(() => { window.location.href = "/"; }, 700);
        } else {
          setMsg(msg, data.detail || "Login failed", "var(--red)");
          btn.disabled = false;
        }
      } catch {
        setMsg(msg, "Network error. Please try again.", "var(--red)");
        btn.disabled = false;
      }
    });

    // --- Register ---
    formRegister.addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const msg = document.getElementById("register-msg");
      const btn = form.querySelector(".submit-btn");

      const isSeller = roleInput.value === "seller";

      const payload = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        phone_number: form.phone_number.value.trim(),
        password: form.password.value,
        role: roleInput.value,
      };

      // Add seller fields if seller
      if (isSeller) {
        payload.company_name = document.getElementById("reg-company").value.trim() || null;
        payload.location = document.getElementById("reg-location").value.trim() || null;
      }

      // Client-side validation
      if (!payload.name || !payload.email || !payload.phone_number || payload.password.length < 6) {
        setMsg(msg, "Please fill in all required fields (password ≥ 6 chars).", "var(--red)");
        return;
      }

      btn.disabled = true;
      setMsg(msg, "Creating account...", "var(--wood-med)");

      try {
        const res = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await parseJsonSafe(res);

        if (res.ok) {
          setMsg(msg, data.message || "Account created.", "var(--green)");
          if (payload.role === "customer") {
            setTimeout(() => showTab("login"), 1500);
          }
          form.reset();
          selectRole("customer");
          btn.disabled = false;
        } else {
          setMsg(msg, data.detail || "Registration failed", "var(--red)");
          btn.disabled = false;
        }
      } catch {
        setMsg(msg, "Network error. Please try again.", "var(--red)");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
