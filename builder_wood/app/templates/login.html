<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account — Builder Wood</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .auth-page { max-width: 480px; margin: 60px auto; padding: 30px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); }
    .auth-tabs { display: flex; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
    .auth-tab { flex: 1; text-align: center; padding: 12px; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
    .auth-tab.active { color: var(--wood-med); border-bottom-color: var(--wood-med); }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--line-2); border-radius: 8px; font-family: inherit; }
    .submit-btn { width: 100%; background: var(--wood-med); color: white; padding: 14px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .submit-btn:hover { background: var(--wood-dark); }
    .msg { margin-top: 15px; font-weight: 600; text-align: center; font-size: 14px; }
    .role-selector { display: flex; gap: 10px; margin-bottom: 16px; }
    .role-option { flex: 1; padding: 12px; border: 1px solid var(--line-2); border-radius: 8px; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; }
    .role-option.active { border-color: var(--wood-med); background: var(--parchment); color: var(--wood-med); }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-main">
      <a class="brand" href="/">
        <span class="brand-mark">🪵</span>
        <span class="brand-text">Builder<em>Wood</em></span>
      </a>
      <a class="catnav-quote" href="/" style="margin-left:auto;padding:8px 14px;color:var(--gold-2);font-weight:700;">← Back to shop</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login">Sign In</div>
      <div class="auth-tab" id="tab-register">Create Account</div>
    </div>

    <!-- LOGIN FORM -->
    <form class="auth-form active" id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="username" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="submit-btn">Log In</button>
      <div class="msg" id="login-msg"></div>
    </form>

    <!-- REGISTER FORM -->
    <form class="auth-form" id="register-form">
      <div class="form-group">
        <label>I am registering as:</label>
        <div class="role-selector">
          <div class="role-option active" data-role="customer">Buyer</div>
          <div class="role-option" data-role="seller">Seller</div>
        </div>
        <input type="hidden" name="role" id="role-input" value="customer">
      </div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone_number" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required minlength="6">
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
      <div class="msg" id="register-msg"></div>
    </form>
  </main>

  <script>
    // --- Tab Switching ---
    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const formLogin = document.getElementById("login-form");
    const formRegister = document.getElementById("register-form");

    function showTab(tab) {
      if (tab === 'login') {
        tabLogin.classList.add("active");
        tabRegister.classList.remove("active");
        formLogin.classList.add("active");
        formRegister.classList.remove("active");
      } else {
        tabRegister.classList.add("active");
        tabLogin.classList.remove("active");
        formRegister.classList.add("active");
        formLogin.classList.remove("active");
      }
    }

    tabLogin.addEventListener("click", () => showTab('login'));
    tabRegister.addEventListener("click", () => showTab('register'));

    if (window.location.search.includes("mode=register")) {
      showTab('register');
    }

    // --- Role Selector ---
    const roleOptions = document.querySelectorAll(".role-option");
    const roleInput = document.getElementById("role-input");

    roleOptions.forEach(opt => {
      opt.addEventListener("click", () => {
        roleOptions.forEach(o => o.classList.remove("active"));
        opt.classList.add("active");
        roleInput.value = opt.dataset.role;
      });
    });

    // --- Login Submit ---
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const msg = document.getElementById("login-msg");
      msg.textContent = "Logging in...";
      msg.style.color = "var(--wood-med)";

      const formData = new URLSearchParams();
      formData.append("username", form.username.value);
      formData.append("password", form.password.value);

      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("bw_token", data.access_token);
          localStorage.setItem("bw_role", data.role);
          localStorage.setItem("bw_name", data.name);
          msg.textContent = "Login successful! Redirecting...";
          msg.style.color = "var(--green)";

          // --- FIX: Always redirect to the shop homepage ---
          setTimeout(() => {
            window.location.href = "/";
          }, 1000);

        } else {
          msg.textContent = data.detail || "Login failed";
          msg.style.color = "var(--red)";
        }
      } catch (err) {
        msg.textContent = "Network error.";
        msg.style.color = "var(--red)";
      }
    });

    // --- Register Submit ---
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const msg = document.getElementById("register-msg");
      msg.textContent = "Creating account...";
      msg.style.color = "var(--wood-med)";

      const payload = {
        name: form.name.value,
        email: form.email.value,
        phone_number: form.phone_number.value,
        password: form.password.value,
        role: roleInput.value
      };

      try {
        const res = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          msg.textContent = data.message;
          msg.style.color = "var(--green)";

          if (payload.role === "customer") {
            setTimeout(() => showTab('login'), 1500);
          }
          form.reset();
        } else {
          msg.textContent = data.detail || "Registration failed";
          msg.style.color = "var(--red)";
        }
      } catch (err) {
        msg.textContent = "Network error.";
        msg.style.color = "var(--red)";
      }
    });
  </script>
</body>
</html>
