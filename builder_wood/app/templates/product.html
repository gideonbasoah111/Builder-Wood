<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3e2723">
  <meta name="color-scheme" content="light">
  <title>Products — {{ shop_name | default("Builder Wood") }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="/static/app.js"></script>

  <style>
    :root { --tap: 44px; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: hidden; }

    .products-page { padding: 40px 0 80px; }
    .products-page h1 {
      font-family: "Fraunces", serif;
      font-size: 34px;
      letter-spacing: -.6px;
      margin: 0 0 6px;
    }
    .products-page .lede {
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 14px;
    }

    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      background: #fff;
      color: var(--ink-2);
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid var(--line-2);
      cursor: pointer;
      min-height: var(--tap);
      -webkit-tap-highlight-color: transparent;
    }
    .chip.active, .chip:hover { background: var(--wood-med); color: #fff; border-color: var(--wood-med); }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .product-grid > * { min-width: 0; }

    .product-card {
      display: flex; flex-direction: column;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .product-image {
      aspect-ratio: 4/3;
      background: linear-gradient(135deg,#e9d7b6,#c3a074);
      display: grid; place-items: center;
      font-size: 42px;
    }
    .product-image img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .product-body { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .product-title {
      font-family: "Fraunces", serif;
      font-size: 16px;
      font-weight: 600;
      margin: 0;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .product-sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .product-foot {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .price { font-family: "Fraunces", serif; font-size: 18px; font-weight: 700; }
    .add-btn {
      min-height: var(--tap);
      padding: 10px 14px;
      border-radius: 6px;
      background: var(--wood-med);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .add-btn:disabled { background: #c7bfb1; cursor: not-allowed; }
    @media (hover: hover) { .add-btn:hover { background: var(--wood-dark); } }

    .state-msg {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
    .state-msg.error { color: var(--red); }

    @media (max-width: 1100px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 820px)  { .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
    @media (max-width: 520px)  { .product-grid { grid-template-columns: 1fr; } .products-page h1 { font-size: 26px; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="container header-main">
      <a class="brand" href="/">
        <span class="brand-mark">🪵</span>
        <span class="brand-text">Builder<em>Wood</em><small>Timber · Ceilings · Doors</small></span>
      </a>
      <a class="catnav-quote" href="/"
         style="margin-left:auto;padding:8px 0;color:var(--gold-2);font-weight:700;">
        ← Back to shop
      </a>
    </div>
  </header>

  <main class="products-page">
    <div class="container">
      <h1>All products</h1>
      <p class="lede">Live inventory from our sellers at Sokoban Wood Village.</p>

      <div class="chip-row" id="chip-row">
        <button class="chip active" data-cat="">All</button>
        <button class="chip" data-cat="hardwood">Hardwood</button>
        <button class="chip" data-cat="softwood">Softwood</button>
        <button class="chip" data-cat="roofing">Roofing</button>
        <button class="chip" data-cat="ceiling">Ceiling &amp; battens</button>
        <button class="chip" data-cat="furniture">Furniture</button>
        <button class="chip" data-cat="interior">Doors &amp; interior</button>
        <button class="chip" data-cat="flooring">Flooring</button>
      </div>

      <div class="product-grid" id="product-grid">
        <div class="state-msg">Loading products…</div>
      </div>
    </div>
  </main>

  <script>
    'use strict';
    (function () {
      const grid   = document.getElementById('product-grid');
      const chipRow= document.getElementById('chip-row');
      const token  = localStorage.getItem('bw_token');

      const escapeHtml = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (c) => ({
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));

      const money = (v, c = 'GHS') => {
        const n = Number(v);
        return Number.isFinite(n) ? `${c} ${n.toFixed(2)}` : '—';
      };

      let currentCat = '';

      async function load(cat) {
        grid.innerHTML = '<div class="state-msg">Loading products…</div>';
        const url = cat ? `/woods/?category=${encodeURIComponent(cat)}` : '/woods/';
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const woods = await res.json();
          render(woods);
        } catch (err) {
          grid.innerHTML =
            `<div class="state-msg error">Error loading products: ${escapeHtml(err.message)}</div>`;
        }
      }

      function render(woods) {
        if (!Array.isArray(woods) || woods.length === 0) {
          grid.innerHTML = '<div class="state-msg">No products in this category yet.</div>';
          return;
        }
        grid.innerHTML = woods.map((w) => {
          const img = w.image_url
            ? `<img src="${escapeHtml(w.image_url)}" alt="${escapeHtml(w.local_name)}" loading="lazy">`
            : '🪵';
          return `
            <article class="product-card">
              <div class="product-image">${img}</div>
              <div class="product-body">
                <p class="product-title">${escapeHtml(w.local_name)}</p>
                <p class="product-sub">${escapeHtml(w.trade_name || '')}</p>
                <div class="product-foot">
                  <span class="price">${money(w.price_per_piece)}</span>
                  <button class="add-btn" type="button"
                          data-wood-id="${Number(w.wood_id)}">Add to cart</button>
                </div>
              </div>
            </article>`;
        }).join('');
        grid.querySelectorAll('button[data-wood-id]').forEach((btn) => {
          btn.addEventListener('click', () => addToCart(btn.dataset.woodId, btn));
        });
      }

      async function addToCart(woodId, btn) {
        if (!token) { window.location.href = '/login'; return; }
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Adding…';
        try {
          const res = await fetch('/cart/add', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token,
            },
            body: JSON.stringify({ wood_id: Number(woodId), quantity: 1 }),
          });
          if (res.status === 401) { window.location.href = '/login'; return; }
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.detail || 'Could not add to cart');
          }
          btn.textContent = '✓ Added';
          setTimeout(() => {
            btn.textContent = original;
            btn.disabled = false;
          }, 1200);
        } catch (err) {
          alert(err.message);
          btn.textContent = original;
          btn.disabled = false;
        }
      }

      chipRow.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        chipRow.querySelectorAll('.chip').forEach((c) => c.classList.remove('active'));
        chip.classList.add('active');
        currentCat = chip.dataset.cat || '';
        load(currentCat);
      });

      load('');
    })();
  </script>
</body>
</html>
