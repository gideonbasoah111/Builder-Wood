<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Builder Wood – Checkout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="builder_wood/index.html">🪵 Builder Wood</a>
    <ul class="navbar-nav ms-auto">
      <li><a class="nav-link" href="builder_wood/index.html">Home</a></li>
      <li><a class="nav-link" href="products.html">Products</a></li>
      <li><a class="nav-link active" href="checkout.html">Checkout</a></li>
      <li><a class="nav-link" href="builder_wood/services.html">Services</a></li>
      <li><a class="nav-link" href="blog.html">Blog</a></li>
    </ul>
  </div>
</nav>

<section class="py-5">
  <div class="container">
    <h2 class="text-center mb-4">Checkout</h2>
    <div class="card p-3 mb-4">
      <h5>Selected Product</h5>
      <p id="cart-item">Loading...</p>
    </div>

    <form class="row g-3 mb-4">
      <div class="col-md-6"><input type="text" class="form-control" placeholder="Full Name" required></div>
      <div class="col-md-6"><input type="email" class="form-control" placeholder="Email" required></div>
      <div class="col-md-6"><input type="tel" class="form-control" placeholder="Phone Number" required></div>
      <div class="col-md-6"><input type="text" class="form-control" placeholder="Delivery Address" required></div>
      <div class="col-12 text-center"><button type="submit" class="btn btn-primary">Confirm Purchase</button></div>
    </form>

    <div class="text-center mb-3">
      <button class="btn btn-danger" onclick="toggleRefund()">Request Refund</button>
    </div>

    <div id="refund-form" style="display:none;">
      <h4 class="mb-3">Refund Request</h4>
      <form class="row g-3">
        <div class="col-md-6"><input type="text" class="form-control" placeholder="Order ID" required></div>
        <div class="col-md-6"><input type="email" class="form-control" placeholder="Email" required></div>
        <div class="col-12"><textarea class="form-control" rows="4" placeholder="Reason for Refund"></textarea></div>
        <div class="col-12 text-center"><button type="submit" class="btn btn-danger">Submit Refund</button></div>
      </form>
    </div>
  </div>
</section>

<script>
  const params = new URLSearchParams(window.location.search);
  const product = params.get("product");
  const price = params.get("price");
  document.getElementById("cart-item").innerText = product && price ? product + " - GHS " + price : "No product selected.";
  function toggleRefund(){
    const form = document.getElementById("refund-form");
    form.style.display = form.style.display === "none" ? "block" : "none";
  }
</script>
</body>
</html>
