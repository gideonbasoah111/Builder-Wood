<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password — Builder Wood</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .auth-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--parchment);
    }
    .auth-card {
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 40px; max-width: 420px; width: 100%; box-shadow: var(--shadow-md);
    }
    .auth-card h1 {
      font-family: Fraunces, serif; font-size: 26px; margin: 0 0 6px;
      color: var(--ink); letter-spacing: -0.3px;
    }
    .auth-card p.sub {
      color: var(--muted); font-size: 13.5px; margin: 0 0 24px;
      line-height: 1.5;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 12.5px; font-weight: 700;
      margin-bottom: 6px; color: var(--ink-2);
    }
    .field input {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--line-2);
      border-radius: 8px; font: inherit; font-size: 14px; outline: 0;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--wood-med); }
    .submit-btn {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: var(--wood-med); color: #fff; font-weight: 700;
      font-size: 14px; cursor: pointer; transition: background 0.15s;
    }
    .submit-btn:hover { background: var(--wood-dark); }
    .submit-btn:disabled { background: #c7bfb1; cursor: not-allowed; }
    .msg {
      margin-top: 16px; padding: 12px 14px; border-radius: 8px;
      font-size: 13px; line-height: 1.5; display: none;
    }
    .msg.show { display: block; }
    .msg.ok { background: #d4edda; color: #155724; }
    .msg.err { background: #f8d7da; color: #721c24; }
    .back-link {
      display: inline-block; margin-top: 20px; font-size: 13px;
      color: var(--wood-med); text-decoration: none; font-weight: 600;
    }
    .back-link:hover { color: var(--wood-dark); }
    .dev-hint {
      margin-top: 12px; padding: 10px; background: #fff3cd;
      border-radius: 6px; font-size: 12px; color: #856404;
      word-break: break-all; display: none;
    }
    .dev-hint.show { display: block; }
    .dev-hint a { color: #856404; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Forgot your password?</h1>
      <p class="sub">
        Enter the email address you used to sign up. We'll send you a link to reset your password.
      </p>

      <form id="forgot-form">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" type="email" required placeholder="you@example.com" autocomplete="email">
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          Send Reset Link
        </button>
      </form>

      <div class="msg" id="msg"></div>
      <div class="dev-hint" id="dev-hint"></div>

      <a href="/login" class="back-link">← Back to login</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("forgot-form");
    const submitBtn = document.getElementById("submit-btn");
    const msg = document.getElementById("msg");
    const devHint = document.getElementById("dev-hint");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";
      devHint.className = "dev-hint";
      devHint.innerHTML = "";

      const email = document.getElementById("email").value.trim();
      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      try {
        const res = await fetch("/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (res.ok) {
          msg.textContent = data.message || "If that email is registered, a reset link has been sent.";
          msg.className = "msg show ok";
          form.reset();

          // Dev mode: show the reset URL in the page for quick testing
          if (data.dev_reset_url) {
            devHint.innerHTML = `
              <strong>Dev mode (SMTP not configured):</strong><br>
              Copy this link to reset your password:<br>
              <a href="${data.dev_reset_url}">${data.dev_reset_url}</a>
            `;
            devHint.className = "dev-hint show";
          }
        } else {
          msg.textContent = data.detail || "Something went wrong. Please try again.";
          msg.className = "msg show err";
        }
      } catch (err) {
        msg.textContent = "Network error. Check your connection.";
        msg.className = "msg show err";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
