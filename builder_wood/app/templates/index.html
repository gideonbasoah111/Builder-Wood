<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin Dashboard — Builder Wood</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .admin-page { max-width: 1240px; margin: 40px auto; padding: 30px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); }
    .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 20px; }
    .admin-header h2 { font-family: Fraunces, serif; margin: 0; }
    .btn { padding: 10px 16px; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-block; cursor: pointer; border: none; }
    .btn-primary { background: var(--wood-med); color: white; }
    .btn-danger { background: var(--red); color: white; }
    .btn-success { background: var(--green); color: white; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .user-card { display: flex; justify-content: space-between; align-items: center; padding: 16px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
    .user-info h4 { margin: 0 0 4px; font-size: 16px; }
    .user-info p { margin: 0; color: var(--muted); font-size: 13px; }

    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; display: inline-block; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-paid { background: #d4edda; color: #155724; }
    .status-confirmed { background: #cce5ff; color: #004085; }
    .status-shipped { background: #d1ecf1; color: #0c5460; }
    .status-delivered { background: #d4edda; color: #155724; }
    .status-cancelled { background: #f8d7da; color: #721c24; }
    .status-disputed { background: #f8d7da; color: #721c24; }
    .status-settled { background: #d1ecf1; color: #0c5460; }
    .status-transferring { background: #fff3cd; color: #856404; }
    .status-eligible { background: #d4edda; color: #155724; }
    .status-not_eligible { background: #e2e3e5; color: #383d41; }
    .status-unpaid { background: #e2e3e5; color: #383d41; }
    .status-active { background: #d4edda; color: #155724; }
    .status-inactive { background: #f8d7da; color: #721c24; }

    .msg { margin-top: 15px; font-weight: 600; color: var(--green); text-align: center; min-height: 20px; }
    .msg.err { color: var(--red); }
    .nav-tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .nav-tabs a { color: var(--muted); font-weight: 600; text-decoration: none; padding: 10px 5px; cursor: pointer; border-bottom: 2px solid transparent; }
    .nav-tabs a.active { color: var(--wood-med); border-bottom-color: var(--wood-med); }
    .empty-text { color: var(--muted); text-align: center; padding: 20px; }

    /* Stats */
    .funds-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card { padding: 20px; border-radius: 12px; border: 1px solid var(--line); background: #fdfaf5; }
    .stat-card .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
    .stat-card .value { font-family: Fraunces, serif; font-size: 24px; font-weight: 700; color: var(--ink); }
    .stat-card.held .value { color: var(--wood-med); }
    .stat-card.earned .value { color: var(--green); }
    .stat-card.failed .value { color: var(--red); }

    /* Sub tabs */
    .sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--line); padding-bottom: 8px; flex-wrap: wrap; }
    .sub-tabs button { padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--ink-2); background: transparent; border: 1px solid transparent; cursor: pointer; }
    .sub-tabs button.active { background: var(--wood-med); color: #fff; }

    /* Tables */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table thead { background: #fdfaf5; }
    .data-table th { padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
    .data-table td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table .amount { font-family: Fraunces, serif; font-weight: 700; }
    .data-table .items-cell { font-size: 12px; color: var(--ink-2); }
    .data-table .totals-row { background: #fdfaf5; font-weight: 700; }
    .data-table .totals-row td { padding: 14px 12px; }

    /* Buttons */
    .btn-release { background: var(--green); color: #fff; padding: 8px 14px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; border: none; white-space: nowrap; transition: background 0.15s; }
    .btn-release:hover { background: #2d5239; }
    .btn-release:disabled { background: #c7bfb1; cursor: not-allowed; }
    .btn-alert { background: #d68910; color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 11px; cursor: pointer; border: none; white-space: nowrap; margin-right: 4px; }
    .btn-alert:hover { background: #b9770e; }
    .warning-text { color: var(--red); font-size: 10.5px; font-weight: 600; margin-top: 4px; display: block; }

    /* Cards */
    .seller-card { padding: 16px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .seller-card h4 { margin: 0 0 4px; font-size: 15px; }
    .seller-card p { margin: 0; color: var(--muted); font-size: 12px; }
    .seller-card .owed { font-family: Fraunces, serif; font-size: 20px; font-weight: 700; color: var(--wood-med); }

    .failed-card { padding: 16px; border: 1px solid #f5c6cb; background: #fff5f5; border-radius: 10px; margin-bottom: 10px; }
    .failed-card h4 { margin: 0 0 6px; font-size: 14px; color: var(--red); }
    .failed-card p { margin: 4px 0; font-size: 12px; color: var(--ink-2); }

    @media (max-width: 900px) {
      .funds-summary { grid-template-columns: repeat(2, 1fr); }
      .data-table { font-size: 12px; }
      .data-table th, .data-table td { padding: 8px 6px; }
      .data-table .items-cell { display: none; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-main">
      <a class="brand" href="/">
        <span class="brand-mark">🪵</span>
        <span class="brand-text">Builder<em>Wood</em><small>Admin Control</small></span>
      </a>
      <a class="catnav-quote" href="/" style="margin-left:auto;padding:8px 14px;color:var(--gold-2);font-weight:700;">← Back to shop</a>
    </div>
  </header>

  <main class="admin-page">
    <div class="admin-header">
      <h2>Admin Dashboard</h2>
      <a href="/seller/upload" class="btn btn-primary">+ Upload My Own Wood</a>
    </div>

    <div class="nav-tabs">
      <a class="active" onclick="switchTab('pending')" id="tab-pending">Pending Sellers</a>
      <a onclick="switchTab('active')" id="tab-active">Active Sellers</a>
      <a onclick="switchTab('customers')" id="tab-customers">Customers</a>
      <a onclick="switchTab('orders')" id="tab-orders">📦 Orders</a>
      <a onclick="switchTab('funds')" id="tab-funds">💰 Funds</a>
    </div>

    <!-- USERS VIEW -->
    <div id="users-view">
      <div id="list-container">
        <p class="empty-text">Loading...</p>
      </div>
    </div>

    <!-- ORDERS VIEW -->
    <div id="orders-view" style="display:none;">
      <div class="sub-tabs">
        <button class="active" onclick="switchOrders('all')" id="orders-tab-all">All Orders</button>
        <button onclick="switchOrders('awaiting')" id="orders-tab-awaiting">Awaiting Release</button>
        <button onclick="switchOrders('disputed')" id="orders-tab-disputed">Disputed</button>
      </div>
      <div id="orders-list-container">
        <p class="empty-text">Loading...</p>
      </div>
    </div>

    <!-- FUNDS VIEW -->
    <div id="funds-view" style="display:none;">
      <div class="funds-summary" id="funds-summary">
        <div class="stat-card"><div class="label">Loading...</div><div class="value">—</div></div>
      </div>

      <div class="sub-tabs">
        <button class="active" onclick="switchFunds('incoming')" id="funds-tab-incoming">💰 Incoming (Held)</button>
        <button onclick="switchFunds('by-seller')" id="funds-tab-by-seller">Owed to Sellers</button>
        <button onclick="switchFunds('settled')" id="funds-tab-settled">Settled</button>
        <button onclick="switchFunds('failed')" id="funds-tab-failed">Failed Transfers</button>
      </div>

      <div id="funds-list-container">
        <p class="empty-text">Loading...</p>
      </div>
    </div>

    <div class="msg" id="msg"></div>
  </main>

  <script>
    const token = localStorage.getItem("bw_token");
    if (!token) window.location.href = "/login";

    const msg = document.getElementById("msg");
    const listContainer = document.getElementById("list-container");
    const ordersContainer = document.getElementById("orders-list-container");
    const fundsContainer = document.getElementById("funds-list-container");
    const usersView = document.getElementById("users-view");
    const ordersView = document.getElementById("orders-view");
    const fundsView = document.getElementById("funds-view");

    let currentTab = "pending";
    let currentOrdersTab = "all";
    let currentFundsTab = "incoming";

    function fmtGHS(v) {
      const n = Number(v);
      return "GH₵" + (Number.isFinite(n) ? n.toFixed(2) : "0.00");
    }

    function fmtDate(s) {
      if (!s) return "—";
      const d = new Date(s);
      return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
    }

    function showMsg(text, isError) {
      msg.textContent = text;
      msg.className = isError ? "msg err" : "msg";
      clearTimeout(showMsg._t);
      showMsg._t = setTimeout(() => { msg.textContent = ""; }, 8000);
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".nav-tabs a").forEach(a => a.classList.remove("active"));
      document.getElementById("tab-" + tab).classList.add("active");

      usersView.style.display = (tab === "orders" || tab === "funds") ? "none" : "block";
      ordersView.style.display = tab === "orders" ? "block" : "none";
      fundsView.style.display = tab === "funds" ? "block" : "none";

      if (tab === "orders") loadOrders();
      else if (tab === "funds") { loadFundsSummary(); loadFundsData(); }
      else loadData();
    }

    function switchOrders(sub) {
      currentOrdersTab = sub;
      document.querySelectorAll("#orders-view .sub-tabs button").forEach(b => b.classList.remove("active"));
      document.getElementById("orders-tab-" + sub).classList.add("active");
      loadOrders();
    }

    function switchFunds(sub) {
      currentFundsTab = sub;
      document.querySelectorAll("#funds-view .sub-tabs button").forEach(b => b.classList.remove("active"));
      document.getElementById("funds-tab-" + sub).classList.add("active");
      loadFundsData();
    }

    // ============================================================
    // USERS
    // ============================================================
    async function loadData() {
      listContainer.innerHTML = '<p class="empty-text">Loading...</p>';
      let endpoint = "";
      if (currentTab === "pending") endpoint = "/admin/pending-sellers";
      if (currentTab === "active") endpoint = "/admin/active-sellers";
      if (currentTab === "customers") endpoint = "/admin/customers";

      try {
        const res = await fetch(endpoint, { headers: { "Authorization": `Bearer ${token}` } });
        if (!res.ok) throw new Error("Failed");
        const users = await res.json();

        if (users.length === 0) {
          listContainer.innerHTML = '<p class="empty-text">No users found in this category.</p>';
          return;
        }

        listContainer.innerHTML = users.map(u => {
          let badge = "", actionBtn = "";
          if (currentTab === "pending") {
            badge = `<span class="status-badge status-pending">Pending</span>`;
            actionBtn = `<button class="btn btn-success btn-sm" onclick="toggleUser(${u.user_id})">Approve</button>`;
          } else if (currentTab === "active") {
            badge = `<span class="status-badge status-active">Active</span>`;
            actionBtn = `<button class="btn btn-danger btn-sm" onclick="toggleUser(${u.user_id})">Deactivate</button>`;
          } else {
            badge = `<span class="status-badge status-active">Customer</span>`;
          }
          return `
            <div class="user-card">
              <div class="user-info">
                <h4>${u.name} ${badge}</h4>
                <p>${u.email} · ${u.phone_number || 'No phone'}</p>
                ${u.company_name ? `<p style="margin-top:4px; font-size:12px; color:var(--wood-med);">${u.company_name}</p>` : ""}
              </div>
              <div>${actionBtn}</div>
            </div>
          `;
        }).join("");
      } catch (err) {
        listContainer.innerHTML = `<p class="empty-text" style="color:var(--red);">Error loading data.</p>`;
      }
    }

    async function toggleUser(id) {
      if (!confirm("Are you sure you want to change this user's status?")) return;
      try {
        const res = await fetch(`/admin/users/${id}/toggle-active`, {
          method: "PATCH",
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (res.ok) {
          showMsg("User status updated successfully!", false);
          loadData();
        } else {
          const err = await res.json();
          showMsg(err.detail || "Failed to update user.", true);
        }
      } catch (err) {
        showMsg("Network error.", true);
      }
    }

    // ============================================================
    // ORDERS (monitoring)
    // ============================================================
    async function loadOrders() {
      ordersContainer.innerHTML = '<p class="empty-text">Loading...</p>';
      try {
        if (currentOrdersTab === "all") await renderAllOrders();
        else if (currentOrdersTab === "awaiting") await renderAwaitingRelease();
        else if (currentOrdersTab === "disputed") await renderDisputed();
      } catch (err) {
        ordersContainer.innerHTML = `<p class="empty-text" style="color:var(--red);">Error loading orders: ${err.message}</p>`;
      }
    }

    async function renderAllOrders() {
      const res = await fetch("/admin/orders/all", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const orders = await res.json();
      if (!orders.length) {
        ordersContainer.innerHTML = '<p class="empty-text">No orders yet.</p>';
        return;
      }
      const rows = orders.map(o => `
        <tr>
          <td>#${o.order_id}</td>
          <td>${o.customer_name}</td>
          <td>${o.seller_name}</td>
          <td class="items-cell">${o.items.map(i => `${i.wood_name} ${i.size} × ${i.quantity}`).join("<br>")}</td>
          <td><span class="status-badge status-${o.status}">${o.status}</span></td>
          <td><span class="status-badge status-${o.payment_status}">${o.payment_status}</span></td>
          <td><span class="status-badge status-${o.delivery_status}">${o.delivery_status}</span></td>
          <td><span class="status-badge status-${o.settlement_status}">${o.settlement_status}</span></td>
          <td class="amount">${fmtGHS(o.total_price)}</td>
          <td class="amount">${fmtGHS(o.seller_payout_amount)}</td>
          <td>${fmtDate(o.order_date)}</td>
          <td>${renderOrderActions(o)}</td>
        </tr>
      `).join("");
      ordersContainer.innerHTML = `
        <table class="data-table">
          <thead>
            <tr>
              <th>Order</th><th>Customer</th><th>Seller</th><th>Items</th>
              <th>Status</th><th>Payment</th><th>Delivery</th><th>Settlement</th>
              <th>Total</th><th>Seller Owed</th><th>Date</th><th>Actions</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function renderOrderActions(o) {
      const canRelease = o.payment_status === "paid"
                       && o.delivery_status === "delivered"
                       && o.settlement_status !== "settled"
                       && o.settlement_status !== "transferring";

      const alerts = `
        <button class="btn-alert" onclick="alertSeller(${o.order_id}, 'delivery_delayed')" title="Alert seller about delay">⏰ Delay</button>
        <button class="btn-alert" onclick="alertSeller(${o.order_id}, 'not_confirming')" title="Ask seller to confirm">❓ Confirm</button>
      `;

      const release = canRelease
        ? `<button class="btn-release" onclick="releaseFunds(${o.order_id})">Release</button>`
        : "";

      return `<div style="display:flex; gap:4px; flex-wrap:wrap;">${alerts}${release}</div>`;
    }

    async function renderAwaitingRelease() {
      const res = await fetch("/admin/orders/awaiting-release", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const orders = await res.json();
      if (!orders.length) {
        ordersContainer.innerHTML = '<p class="empty-text">No orders awaiting release. ✅</p>';
        return;
      }
      const rows = orders.map(o => `
        <tr>
          <td>#${o.order_id}</td>
          <td>${o.customer_name}</td>
          <td>${o.seller_name}</td>
          <td class="amount">${fmtGHS(o.seller_payout_amount)}</td>
          <td>${fmtDate(o.auto_confirm_at)}</td>
          <td>
            ${!o.seller_has_recipient ? '<span class="warning-text">⚠ No payout account</span>' : ''}
            <button class="btn-release" onclick="releaseFunds(${o.order_id})"
              ${!o.seller_has_recipient ? 'disabled' : ''}>
              Release Funds
            </button>
          </td>
        </tr>
      `).join("");
      ordersContainer.innerHTML = `
        <table class="data-table">
          <thead>
            <tr><th>Order</th><th>Customer</th><th>Seller</th><th>Amount to Release</th><th>Eligible Since</th><th>Action</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    async function renderDisputed() {
      const res = await fetch("/admin/orders/disputes", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const orders = await res.json();
      if (!orders.length) {
        ordersContainer.innerHTML = '<p class="empty-text">No active disputes. ✅</p>';
        return;
      }
      const rows = orders.map(o => `
        <tr>
          <td>#${o.order_id}</td>
          <td>${o.buyer_id}</td>
          <td>${o.seller_id}</td>
          <td>${o.reason || "—"}</td>
          <td class="amount">${fmtGHS(o.total)}</td>
          <td>
            <button class="btn btn-success btn-sm" onclick="resolveDispute(${o.order_id}, 'release')">Release to Seller</button>
            <button class="btn btn-danger btn-sm" onclick="resolveDispute(${o.order_id}, 'refund')">Refund Buyer</button>
          </td>
        </tr>
      `).join("");
      ordersContainer.innerHTML = `
        <table class="data-table">
          <thead>
            <tr><th>Order</th><th>Buyer ID</th><th>Seller ID</th><th>Reason</th><th>Total</th><th>Action</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    async function resolveDispute(orderId, action) {
      const verb = action === "release" ? "release funds to seller" : "refund the buyer (cancel order)";
      if (!confirm(`Are you sure you want to ${verb} for order #${orderId}?`)) return;
      try {
        const res = await fetch(`/admin/orders/${orderId}/resolve-dispute?action=${action}`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        if (res.ok) {
          showMsg(`Dispute resolved: ${data.new_status}`, false);
          loadOrders();
        } else {
          showMsg(`Error: ${data.detail}`, true);
        }
      } catch (err) {
        showMsg(`Network error: ${err.message}`, true);
      }
    }

    // ============================================================
    // FUNDS
    // ============================================================
    async function loadFundsSummary() {
      const host = document.getElementById("funds-summary");
      try {
        const res = await fetch("/admin/funds/summary", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("Failed");
        const d = await res.json();
        host.innerHTML = `
          <div class="stat-card held">
            <div class="label">Held in Escrow</div>
            <div class="value">${fmtGHS(d.total_held)}</div>
          </div>
          <div class="stat-card">
            <div class="label">Commission Pending</div>
            <div class="value">${fmtGHS(d.total_commission_pending)}</div>
          </div>
          <div class="stat-card earned">
            <div class="label">Commission Earned</div>
            <div class="value">${fmtGHS(d.total_commission_earned)}</div>
          </div>
          <div class="stat-card failed">
            <div class="label">Failed Transfers</div>
            <div class="value">${d.failed_transfers_count}</div>
          </div>
        `;
      } catch (err) {
        host.innerHTML = `<p class="empty-text" style="color:var(--red);">Error loading summary.</p>`;
      }
    }

    async function loadFundsData() {
      fundsContainer.innerHTML = '<p class="empty-text">Loading...</p>';
      try {
        if (currentFundsTab === "incoming") await renderIncoming();
        else if (currentFundsTab === "settled") await renderSettled();
        else if (currentFundsTab === "by-seller") await renderBySeller();
        else if (currentFundsTab === "failed") await renderFailed();
      } catch (err) {
        fundsContainer.innerHTML = `<p class="empty-text" style="color:var(--red);">Error loading funds data.</p>`;
      }
    }

    async function renderIncoming() {
      const res = await fetch("/admin/funds/incoming", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      if (!data.orders.length) {
        fundsContainer.innerHTML = '<p class="empty-text">No funds currently held. ✅</p>';
        return;
      }
      const rows = data.orders.map(o => {
        const canRelease = o.delivery_status === "delivered"
                         && o.settlement_status !== "settled"
                         && o.settlement_status !== "transferring";
        return `
          <tr>
            <td>#${o.order_id}</td>
            <td>${o.customer_name}</td>
            <td>${o.seller_name}</td>
            <td class="items-cell">${o.items.map(i => `${i.wood_name} ${i.size} × ${i.quantity}`).join("<br>")}</td>
            <td class="amount">${fmtGHS(o.total_price)}</td>
            <td class="amount">${fmtGHS(o.platform_commission)}</td>
            <td class="amount">${fmtGHS(o.seller_payout_amount)}</td>
            <td>${fmtDate(o.paid_at)}</td>
            <td><span class="status-badge status-${o.settlement_status}">${o.settlement_status}</span></td>
            <td>
              <button class="btn-release" onclick="releaseFunds(${o.order_id})"
                ${!canRelease ? 'disabled title="Order must be delivered before release"' : ''}>
                Release Funds
              </button>
              ${!canRelease ? '<span class="warning-text">Awaiting delivery</span>' : ''}
            </td>
          </tr>
        `;
      }).join("");
      fundsContainer.innerHTML = `
        <table class="data-table">
          <thead>
            <tr>
              <th>Order</th><th>Customer</th><th>Seller</th><th>Items</th>
              <th>Paid</th><th>Commission</th><th>Seller Owed</th>
              <th>Paid On</th><th>Status</th><th>Action</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
          <tfoot>
            <tr class="totals-row">
              <td colspan="4">Total Held</td>
              <td class="amount">${fmtGHS(data.totals.total_held)}</td>
              <td class="amount">${fmtGHS(data.totals.total_commission_pending)}</td>
              <td class="amount">${fmtGHS(data.totals.total_owed_to_sellers)}</td>
              <td colspan="3"></td>
            </tr>
          </tfoot>
        </table>
      `;
    }

    async function renderSettled() {
      const res = await fetch("/admin/funds/settled", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      if (!data.orders.length) {
        fundsContainer.innerHTML = '<p class="empty-text">No settled transfers yet.</p>';
        return;
      }
      const rows = data.orders.map(o => `
        <tr>
          <td>#${o.order_id}</td>
          <td>${o.seller_name}</td>
          <td class="items-cell">${o.items.map(i => `${i.wood_name} × ${i.quantity}`).join("<br>")}</td>
          <td class="amount">${fmtGHS(o.seller_payout_amount)}</td>
          <td>${fmtDate(o.settlement_eligible_at)}</td>
        </tr>
      `).join("");
      fundsContainer.innerHTML = `
        <table class="data-table">
          <thead>
            <tr><th>Order</th><th>Seller</th><th>Items</th><th>Amount Paid</th><th>Settled On</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    async function renderBySeller() {
      const res = await fetch("/admin/funds/by-seller", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      if (!data.sellers.length) {
        fundsContainer.innerHTML = '<p class="empty-text">No sellers registered.</p>';
        return;
      }
      fundsContainer.innerHTML = data.sellers.map(s => `
        <div class="seller-card">
          <div>
            <h4>${s.seller_name}</h4>
            <p>${s.orders_pending} pending · ${s.orders_settled} settled</p>
          </div>
          <div style="text-align:right;">
            <div class="owed">${fmtGHS(s.total_owed)}</div>
            <div style="color:var(--muted); font-size:11px; margin-top:2px;">owed</div>
            <div style="color:var(--muted); font-size:11px; margin-top:4px;">Total paid: ${fmtGHS(s.total_settled)}</div>
          </div>
        </div>
      `).join("");
    }

    async function renderFailed() {
      const res = await fetch("/admin/funds/failed", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await res.json();
      if (!data.failed_transfers.length) {
        fundsContainer.innerHTML = '<p class="empty-text">No failed transfers. ✅</p>';
        return;
      }
      fundsContainer.innerHTML = data.failed_transfers.map(f => `
        <div class="failed-card">
          <h4>Order #${f.order_id} — ${fmtGHS(f.seller_payout_amount)}</h4>
          <p><strong>Seller:</strong> ${f.seller_name}</p>
          <p><strong>Reference:</strong> ${f.transfer_reference || "—"}</p>
          <p><strong>Reason:</strong> ${f.transfer_failed_reason || "Unknown"}</p>
        </div>
      `).join("");
    }

    // ============================================================
    // ACTIONS — Release Funds + Alert Seller
    // ============================================================
    async function releaseFunds(orderId) {
      if (!confirm(`Release funds for order #${orderId}?\n\nThis will send the seller's share to their Paystack account. This cannot be undone.`)) {
        return;
      }

      showMsg("Initiating transfer...", false);

      try {
        const res = await fetch(`/admin/orders/${orderId}/release-funds-v2`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();

        if (res.ok) {
          showMsg(`✅ Transfer initiated (ref: ${data.reference}). Order will settle once Paystack confirms.`, false);
          if (currentTab === "funds") { loadFundsSummary(); loadFundsData(); }
          if (currentTab === "orders") loadOrders();
        } else {
          showMsg(`❌ ${data.detail || "Release failed"}`, true);
        }
      } catch (err) {
        showMsg(`❌ Network error: ${err.message}`, true);
      }
    }

    async function alertSeller(orderId, reason) {
      const reasonText = reason === "delivery_delayed"
        ? "delivery delay"
        : "not confirming the order";
      if (!confirm(`Send an alert to the seller about "${reasonText}" for order #${orderId}?`)) return;

      try {
        const res = await fetch(`/admin/orders/${orderId}/alert-seller?reason=${reason}`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        if (res.ok) {
          showMsg("✅ Alert sent to seller.", false);
        } else {
          showMsg(`❌ ${data.detail || "Failed to send alert"}`, true);
        }
      } catch (err) {
        showMsg(`❌ Network error: ${err.message}`, true);
      }
    }

    window.releaseFunds = releaseFunds;
    window.alertSeller = alertSeller;
    window.resolveDispute = resolveDispute;

    // Initial load
    loadData();
  </script>
</body>
</html>
