<style>
  :root {
    --tap: 44px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { overflow-x: hidden; }

  /* ---------- sticky announce + header (safe-area aware) ---------- */
  .announce {
    padding-top: max(0px, var(--safe-t));
    padding-left: max(0px, var(--safe-l));
    padding-right: max(0px, var(--safe-r));
  }
  .header { position: sticky; top: 0; z-index: 40; }

  /* ---------- tap targets & hover gating ---------- */
  .btn, .cart-btn, .catnav-link, .catnav-all, .chip, .link {
    -webkit-tap-highlight-color: transparent;
  }
  .btn { min-height: var(--tap); }

  @media (hover: hover) {
    .btn-gold:hover   { filter: brightness(1.05); }
    .btn-primary:hover{ filter: brightness(0.95); }
    .chip:hover       { border-color: var(--wood-med); }
  }

  /* ---------- long strings never break layout ---------- */
  .hero-copy h1,
  .hero-copy p,
  .about-copy p,
  .band-copy p,
  .service-card-copy p,
  .contact-list a,
  .footer-col a,
  .footer-brand p,
  .product-grid,
  .chip-row { overflow-wrap: anywhere; }

  /* ---------- iOS zoom fix for search input ---------- */
  @media (max-width: 600px) {
    .search input { font-size: 16px; }
  }

  /* ---------- catnav: horizontal scroll on narrow ---------- */
  @media (max-width: 1024px) {
    .catnav-inner {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 4px;
    }
    .catnav-inner::-webkit-scrollbar { display: none; }
    .catnav-inner > * { flex: 0 0 auto; }
    .catnav-drop { position: relative; }
    .catnav-quote { margin-left: 0; }
  }

  /* ---------- hero ---------- */
  .hero {
    padding-left: max(0px, var(--safe-l));
    padding-right: max(0px, var(--safe-r));
  }
  .hero-copy h1 { line-height: 1.08; }

  @media (max-width: 960px) {
    .hero-stamp { display: none; }
    .hero { min-height: min(78svh, 720px); }
  }
  @media (max-width: 600px) {
    .hero-copy h1 { font-size: clamp(28px, 8vw, 40px); }
    .hero-copy p  { font-size: 15px; }
    .hero-actions  { flex-wrap: wrap; }
    .hero-actions .btn { flex: 1 1 100%; }
    .hero-points li { font-size: 13px; }
  }

  /* ---------- trust ---------- */
  @media (max-width: 900px) {
    .trust-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .trust-grid { grid-template-columns: 1fr; }
  }

  /* ---------- products ---------- */
  .product-grid { min-width: 0; }
  .product-grid > * { min-width: 0; }

  @media (max-width: 480px) {
    .product-grid { grid-template-columns: 1fr; }
    .section-head { flex-direction: column; align-items: flex-start; gap: 12px; }
    .result-bar   { flex-wrap: wrap; gap: 8px; }
  }

  /* ---------- chips: scroll if they overflow ---------- */
  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  @media (max-width: 600px) {
    .chip-row {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; min-height: var(--tap); }
  }

  /* ---------- about ---------- */
  @media (max-width: 820px) {
    .about-grid { grid-template-columns: 1fr; }
    .about-image img { width: 100%; height: auto; display: block; }
  }

  /* ---------- services ---------- */
  @media (max-width: 900px) {
    .service-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .service-grid { grid-template-columns: 1fr; }
    .service-art  { min-height: 140px; }
  }

  /* ---------- band ---------- */
  @media (max-width: 820px) {
    .band-grid { grid-template-columns: 1fr; gap: 24px; }
  }

  /* ---------- contact ---------- */
  @media (max-width: 720px) {
    .contact-card { grid-template-columns: 1fr; gap: 20px; }
    .contact-cta  { width: 100%; justify-content: center; }
  }

  /* ---------- footer ---------- */
  @media (max-width: 900px) {
    .footer-grid { grid-template-columns: 1fr 1fr; gap: 24px; }
  }
  @media (max-width: 480px) {
    .footer-grid { grid-template-columns: 1fr; }
    .footer-bottom-inner { flex-direction: column; gap: 6px; text-align: center; }
  }

  /* ---------- cart drawer: fullscreen on phones ---------- */
  @media (max-width: 600px) {
    .drawer {
      width: 100vw !important;
      max-width: 100vw !important;
      max-height: 100dvh !important;
      border-radius: 0 !important;
      padding-bottom: max(16px, var(--safe-b));
    }
    .drawer-head h3 { font-size: 18px; }
  }

  /* ---------- tiny phones ---------- */
  @media (max-width: 380px) {
    .hero-actions .btn { padding: 12px 14px; }
    .section-head h2   { font-size: 22px; }
    .container         { padding-inline: 14px; }
  }

  /* ============================================================
     DESKTOP & LARGE SCREENS (≥1025px) — NEW
     ============================================================ */
  @media (min-width: 1025px) {

    /* Cap content width so it doesn't stretch edge-to-edge on ultrawide */
    .container {
      max-width: 1280px;
      margin-inline: auto;
      padding-inline: clamp(20px, 4vw, 40px);
    }

    /* Header: let search breathe between brand and actions */
    .header-main {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: clamp(16px, 3vw, 32px);
    }
    .search {
      max-width: 520px;
      justify-self: center;
      width: 100%;
    }
    .brand-text small { display: block; }   /* tagline always visible on desktop */

    /* Category nav: inline row, no scrolling needed */
    .catnav-inner {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: visible;          /* allow dropdown menu to escape */
    }
    .catnav-link {
      white-space: nowrap;
      padding: 10px 14px;
      border-radius: 8px;
    }
    .catnav-link:hover { background: rgba(255,255,255,.08); }
    .catnav-quote { margin-left: auto; }

    /* Dropdown menu positioning */
    .catnav-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 560px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,.15);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity .2s ease, transform .2s ease, visibility .2s;
      z-index: 50;
    }
    .catnav-drop:hover .catnav-menu,
    .catnav-drop:focus-within .catnav-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* Hero: comfortable reading measure, stamp stays visible */
    .hero { min-height: min(82svh, 800px); }
    .hero-copy { max-width: 640px; }
    .hero-copy h1 { font-size: clamp(36px, 4vw, 56px); }
    .hero-copy p  { font-size: 17px; max-width: 52ch; }

    /* Products: richer grid as space allows */
    .product-grid {
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    /* Trust strip: keep 4 columns on wide desktops */
    @media (min-width: 1200px) {
      .trust-grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* Services: 4-across on big screens */
    @media (min-width: 1200px) {
      .service-grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* About: side-by-side with generous image */
    .about-grid {
      grid-template-columns: 1.1fr 1fr;
      gap: clamp(32px, 5vw, 64px);
      align-items: center;
    }
    .about-image img {
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 16px;
    }

    /* Band / delivery */
    .band-grid {
      grid-template-columns: 1fr 1fr;
      gap: clamp(32px, 5vw, 64px);
      align-items: center;
    }

    /* Contact card */
    .contact-card {
      grid-template-columns: 1.2fr 1fr auto;
      gap: 40px;
      align-items: center;
    }

    /* Footer */
    .footer-grid {
      grid-template-columns: 1.4fr 1fr 1fr 1fr;
      gap: 40px;
    }
  }

  /* ============================================================
     TABLET PORTRAIT TWEAKS (601–1024px) — NEW
     ============================================================ */
  @media (min-width: 601px) and (max-width: 1024px) {
    .container { padding-inline: 24px; }

    /* Search shrinks gracefully instead of squishing */
    .header-main { gap: 12px; }
    .search { max-width: 320px; }
    .auth-signup { display: none; }        /* hide Sign Up to save space */

    /* Product grid: 2–3 columns depending on width */
    .product-grid {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    /* Hero scales down but keeps impact */
    .hero-copy h1 { font-size: clamp(30px, 5vw, 44px); }
    .hero { min-height: min(70svh, 640px); }

    /* Cart drawer: slide-over panel, not fullscreen */
    .drawer {
      width: min(420px, 90vw);
      max-height: 90dvh;
      border-radius: 16px 0 0 16px;
    }
  }

  /* ============================================================
     SHORT VIEWPORTS (e.g. landscape phone, dev-tools window) — NEW
     ============================================================ */
  @media (max-height: 500px) and (orientation: landscape) {
    .hero { min-height: auto; padding-block: 40px; }
    .hero-stamp { display: none; }
    .announce { display: none; }           /* reclaim vertical space */
  }

  /* ============================================================
     PRINT — NEW (bonus nicety)
     ============================================================ */
  @media print {
    .header, .announce, .cart-btn, .drawer, .backdrop, .toast,
    .catnav, .search, .hero-actions, .contact-cta { display: none !important; }
    .hero { min-height: auto; }
    body { color: #000; background: #fff; }
  }
</style>
