<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat — Builder Wood</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .chat-page { max-width: 720px; margin: 40px auto; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; height: calc(100vh - 120px); min-height: 500px; }
    .chat-header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
    .chat-header .back { color: var(--wood-med); text-decoration: none; font-weight: 700; font-size: 13px; }
    .chat-header h3 { font-family: Fraunces, serif; margin: 0; font-size: 18px; }
    .chat-header .role { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
    .wood-context { padding: 10px 20px; background: var(--parchment); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
    .wood-context a { color: var(--wood-med); font-weight: 700; text-decoration: none; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #fdfaf5; }
    .msg-row { display: flex; gap: 8px; max-width: 80%; }
    .msg-row.sent { align-self: flex-end; flex-direction: row-reverse; }
    .msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; word-wrap: break-word; }
    .msg-row.received .msg-bubble { background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .msg-row.sent .msg-bubble { background: var(--wood-med); color: #fff; border-bottom-right-radius: 4px; }
    .msg-meta { font-size: 10.5px; color: var(--muted); margin-top: 4px; }
    .msg-row.sent .msg-meta { text-align: right; }
    .chat-input { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: #fff; }
    .chat-input textarea { flex: 1; padding: 10px 12px; border: 1.5px solid var(--line-2); border-radius: 10px; font: inherit; font-size: 14px; resize: none; max-height: 120px; outline: 0; }
    .chat-input textarea:focus { border-color: var(--wood-med); }
    .chat-input button { padding: 0 22px; background: var(--wood-med); color: #fff; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
    .chat-input button:hover { background: var(--wood-dark); }
    .chat-input button:disabled { background: #c7bfb1; cursor: not-allowed; }
    .chat-error { padding: 10px 16px; background: #f8d7da; color: #721c24; font-size: 12.5px; font-weight: 600; display: none; }
    .chat-error.show { display: block; }
    .loading-text { text-align: center; padding: 40px; color: var(--muted); }
    @media (max-width: 700px) {
      .chat-page { margin: 12px; height: calc(100vh - 100px); }
      .msg-row { max-width: 90%; }
    }
  </style>
</head>
<body>
  <main class="chat-page">
    <div class="chat-header">
      <a href="/messages" class="back">← Back</a>
      <div>
        <h3 id="chat-title">Loading...</h3>
        <span class="role" id="chat-role"></span>
      </div>
    </div>

    <div class="wood-context" id="wood-context" style="display: none;"></div>

    <div class="chat-messages" id="chat-messages">
      <p class="loading-text">Loading messages...</p>
    </div>

    <div class="chat-error" id="chat-error"></div>

    <div class="chat-input">
      <textarea id="msg-input" placeholder="Type a message..." rows="1"></textarea>
      <button id="msg-send" onclick="sendCurrentMessage()">Send</button>
    </div>
  </main>

  <script src="/static/messages.js"></script>
  <script>
    const CONV_ID = parseInt(window.location.pathname.split("/").pop(), 10);

    document.addEventListener("DOMContentLoaded", () => {
      Messages.loadChat(CONV_ID);
    });

    function sendCurrentMessage() {
      Messages.sendMessage(CONV_ID);
    }

    // Enter to send, Shift+Enter for newline
    document.getElementById("msg-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        Messages.sendMessage(CONV_ID);
      }
    });
  </script>
</body>
</html>
