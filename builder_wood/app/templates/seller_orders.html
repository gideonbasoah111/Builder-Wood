<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Seller Orders — Builder Wood</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    :root { --tap: 44px; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: hidden; }

    body {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    /* ---------- layout ---------- */
    .dashboard-page {
      max-width: 960px;
      margin: 40px auto;
      padding: 30px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow-wrap: anywhere;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    .dash-header h2 { font-family: Fraunces, serif; margin: 0; }

    /* ---------- header back link ---------- */
    .header-main { flex-wrap: wrap; gap: 12px; }
    .header-main .catnav-quote { margin-left: auto; }
    @media (max-width: 480px) {
      .header-main .catnav-quote { margin-left: 0; padding: 8px 0; }
    }

    /* ---------- stats ---------- */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--parchment);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      min-width: 0;
    }
    .stat-card .stat-num {
      font-size: 22px;
      font-weight: 700;
      font-family: Fraunces, serif;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }
    .stat-card .stat-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
      margin-top: 2px;
    }

    /* ---------- toolbar ---------- */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex-wrap: nowrap;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .nav-tabs a {
      color: var(--muted);
      font-weight: 600;
      text-decoration: none;
      padding: 10px 6px;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      flex: 0 0 auto;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-tabs a.active,
    .nav-tabs a[aria-current="page"] {
      color: var(--wood-med);
      border-bottom-color: var(--wood-med);
    }

    .filters {
      display: flex;
      gap: 8px;
      padding-bottom: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--ink-2);
      min-height: 34px;
      -webkit-tap-highlight-color: transparent;
    }
    .chip[aria-pressed="true"] {
      background: var(--wood-med);
      border-color: var(--wood-med);
      color: #fff;
    }
    .search-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      min-height: 34px;
      flex: 1 1 160px;
      min-width: 140px;
      max-width: 240px;
      background: #fff;
      color: var(--ink);
      outline: 0;
    }
    .search-box:focus { border-color: var(--wood-med); }

    /* ---------- alerts ---------- */
    .alert-box {
      background: #fff;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      border-left: 5px solid;
      box-shadow: var(--shadow-sm);
    }
    .alert-low { border-left-color: #f0ad4e; background: #fffdf5; }
    .alert-out { border-left-color: var(--red); background: #fff9f9; }

    .alert-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .alert-low .alert-icon { background: #fdf2e3; color: #d68910; }
    .alert-out .alert-icon { background: #fdebea; color: var(--red); }

    .alert-content { flex: 1; min-width: 0; }
    .alert-content h4 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
    .alert-low .alert-content h4 { color: #8a5a00; }
    .alert-out .alert-content h4 { color: #7a1f1a; }
    .alert-content p { margin: 0 0 12px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }

    .alert-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .alert-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 13px;
      padding: 6px 10px;
      background: #fff;
      border-radius: 6px;
      border: 1px solid var(--line);
      overflow-wrap: anywhere;
    }
    .alert-item b { font-weight: 700; white-space: nowrap; }
    .alert-low .alert-item b { color: #8a5a00; }
    .alert-out .alert-item b { color: var(--red); }

    .alert-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s;
    }
    .alert-low .alert-btn { background: #f0ad4e; color: #fff; }
    .alert-out .alert-btn { background: var(--red); color: #fff; }

    /* ---------- order cards ---------- */
    .order-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
      min-width: 0;
    }
    .order-card > * { min-width: 0; }

    .order-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 15px 20px;
      background: var(--parchment);
      border-bottom: 1px solid var(--line);
    }
    .order-head h4 {
      margin: 0;
      font-size: 15px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      overflow-wrap: anywhere;
    }
    .order-head .meta {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }
    .status {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
      letter-spacing: .02em;
    }
    .status-pending   { background: #fff3cd; color: #856404; }
    .status-confirmed { background: #cce5ff; color: #004085; }
    .status-shipped   { background: #d1ecf1; color: #0c5460; }
    .status-delivered { background: #d4edda; color: #155724; }
    .status-cancelled { background: #f8d7da; color: #721c24; }

    .order-body { padding: 20px; }
    .order-items { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }

    .order-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      min-width: 0;
    }
    .order-item > span:first-child { overflow-wrap: anywhere; min-width: 0; flex: 1 1 auto; }
    .order-item > span:last-child { white-space: nowrap; font-weight: 600; }

    .order-total {
      font-weight: 700;
      font-size: 15px;
      border-top: 1px dashed var(--line);
      padding-top: 15px;
      margin-top: 15px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .order-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      border: none;
      min-height: 36px;
      -webkit-tap-highlight-color: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary { background: var(--wood-med); color: #fff; }
    .btn-success { background: var(--green); color: #fff; }
    .btn-danger  { background: #b02a37; color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 11px; min-height: 32px; }

    .msg {
      margin-top: 15px;
      font-weight: 600;
      text-align: center;
      min-height: 1.2em;
      overflow-wrap: anywhere;
    }
    .msg.ok  { color: var(--green); }
    .msg.err { color: var(--red); }

    /* ---------- skeleton ---------- */
    .skeleton {
      position: relative;
      overflow: hidden;
      background: var(--parchment-2, #eee);
      border-radius: 10px;
      height: 120px;
      margin-bottom: 20px;
    }
    .skeleton::after {
      content: "";
      position: absolute;
      inset: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer { to { transform: translateX(100%); } }

    /* ---------- modal ---------- */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 12, 4, .6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
      overflow-wrap: anywhere;
    }
    .modal h3 { font-family: "Fraunces", serif; font-size: 20px; margin: 0 0 10px; }
    .modal p { color: var(--ink-2); margin: 0 0 20px; font-size: 14px; line-height: 1.5; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .modal-actions .btn { flex: 1 1 120px; min-height: var(--tap); }
    .btn-cancel  { background: var(--parchment-2); color: var(--ink); }
    .btn-confirm { background: var(--wood-med); color: #fff; }

    /* ---------- tablet ---------- */
    @media (max-width: 720px) {
      .dashboard-page { margin: 24px 12px; padding: 22px 18px; border-radius: 12px; }
      .order-body { padding: 16px; }
      .order-head { padding: 12px 16px; }
    }

    /* ---------- phone ---------- */
    @media (max-width: 600px) {
      .toolbar { flex-direction: column; align-items: stretch; gap: 10px; }
      .nav-tabs { justify-content: flex-start; }
      .filters { padding-bottom: 12px; }
      .search-box { max-width: 100%; flex: 1 1 100%; }

      .stat-card .stat-num { font-size: 20px; }

      .alert-box { padding: 14px 16px; gap: 12px; }
      .alert-icon { width: 34px; height: 34px; }
    }

    @media (max-width: 520px) {
      .order-head { flex-direction: column; align-items: flex-start; }
      .order-head .status { align-self: flex-end; }

      .order-item { flex-direction: column; gap: 4px; }
      .order-item > span:last-child { align-self: flex-end; }

      .order-actions { flex-direction: column; }
      .order-actions .btn { width: 100%; }

      .modal-actions { flex-direction: column; }
      .modal-actions .btn { width: 100%; }
    }

    /* ---------- tiny phones ---------- */
    @media (max-width: 360px) {
      .dashboard-page { margin: 12px 8px; padding: 16px 12px; }
      .dash-header h2 { font-size: 20px; }
      .order-head h4 { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton::after { animation: none; opacity: .45; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-main">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true">🪵</span>
        <span class="brand-text">Builder<em>Wood</em><small>Seller Dashboard</small></span>
      </a>
      <a class="catnav-quote" href="/" style="padding:8px 0;color:var(--gold-2);font-weight:700;">← Back to shop</a>
    </div>
  </header>

  <main class="dashboard-page">
    <div class="dash-header">
      <h2>Seller Dashboard</h2>
      <button class="btn btn-sm btn-primary" id="refresh-btn" type="button">↻ Refresh</button>
    </div>

    <section class="stats-strip" id="stats-strip" aria-label="Order summary"></section>

    <div class="toolbar">
      <nav class="nav-tabs" aria-label="Seller sections">
        <a href="/seller/upload">Upload Wood</a>
        <a href="/seller/products">My Products</a>
        <a href="/seller/orders" aria-current="page">My Orders</a>
      </nav>
      <div class="filters" role="group" aria-label="Filter orders by status">
        <input class="search-box" id="search" type="search" placeholder="Search order #…" aria-label="Search by order number">
        <button class="chip" data-filter="all"       aria-pressed="true"  type="button">All</button>
        <button class="chip" data-filter="pending"   aria-pressed="false" type="button">Pending</button>
        <button class="chip" data-filter="confirmed" aria-pressed="false" type="button">Confirmed</button>
        <button class="chip" data-filter="shipped"   aria-pressed="false" type="button">Shipped</button>
        <button class="chip" data-filter="delivered" aria-pressed="false" type="button">Delivered</button>
      </div>
    </div>

    <div id="alerts-container"></div>

    <div id="orders-list" aria-live="polite"></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </main>

  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
      <h3 id="modal-title">Confirm Action</h3>
      <p id="modal-message">Are you sure you want to do this?</p>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="modal-cancel" type="button">Cancel</button>
        <button class="btn btn-confirm" id="modal-confirm" type="button">Yes, continue</button>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const token = localStorage.getItem("bw_token");
    if (!token) window.location.replace("/login");

    const msgEl   = document.getElementById("msg");
    const listEl  = document.getElementById("orders-list");
    const statsEl = document.getElementById("stats-strip");
    const searchEl = document.getElementById("search");
    const refreshBtn = document.getElementById("refresh-btn");
    const alertsContainer = document.getElementById("alerts-container");

    let allOrders = [];
    let activeFilter = "all";
    let searchTerm = "";

    const escapeHtml = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    const fmtMoney = (n) => "GH₵ " + Number(n || 0).toFixed(2);

    function showMsg(text, ok = true) {
      msgEl.textContent = text;
      msgEl.className = "msg " + (ok ? "ok" : "err");
      clearTimeout(showMsg._t);
      showMsg._t = setTimeout(() => { msgEl.textContent = ""; }, 5000);
    }

    async function api(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: { "Authorization": `Bearer ${token}`, ...(options.headers || {}) }
      });
      if (res.status === 401) { window.location.replace("/login"); throw new Error("Session expired"); }
      if (!res.ok) {
        let detail = "Request failed.";
        try { detail = (await res.json()).detail || detail; } catch {}
        throw new Error(detail);
      }
      return res.json();
    }

    /* ---------- accessible modal ---------- */
    const backdrop = document.getElementById("modal-backdrop");
    const mTitle   = document.getElementById("modal-title");
    const mMessage = document.getElementById("modal-message");
    const mCancel  = document.getElementById("modal-cancel");
    const mConfirm = document.getElementById("modal-confirm");

    let pendingAction = null;
    let lastFocused = null;

    function showModal(title, message, onConfirm) {
      mTitle.textContent = title;
      mMessage.textContent = message;
      lastFocused = document.activeElement;
      pendingAction = onConfirm;
      backdrop.classList.add("show");
      mConfirm.focus();
    }

    function hideModal() {
      backdrop.classList.remove("show");
      pendingAction = null;
      if (lastFocused) lastFocused.focus();
    }

    mCancel.addEventListener("click", hideModal);
    mConfirm.addEventListener("click", () => {
      const fn = pendingAction;
      hideModal();
      if (fn) fn();
    });
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) hideModal(); });
    document.addEventListener("keydown", (e) => {
      if (!backdrop.classList.contains("show")) return;
      if (e.key === "Escape") hideModal();
    });

    /* ---------- stock alerts ---------- */
    async function checkStockAlerts() {
      try {
        const items = await api("/seller/low-stock");
        if (!Array.isArray(items) || items.length === 0) {
          alertsContainer.innerHTML = "";
          return;
        }

        const outOfStock = items.filter(i => Number(i.stock) <= 0);
        const lowStock = items.filter(i => Number(i.stock) > 0 && Number(i.stock) <= 10);

        let html = "";

        if (outOfStock.length > 0) {
          const
