<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seller Orders — Builder Wood</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .dashboard-page { max-width: 960px; margin: 40px auto; padding: 30px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); }
    .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
    .dash-header h2 { font-family: Fraunces, serif; margin: 0; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .nav-tabs a { color: var(--muted); font-weight: 600; text-decoration: none; padding: 10px 6px; border-bottom: 2px solid transparent; }
    .nav-tabs a.active { color: var(--wood-med); border-bottom-color: var(--wood-med); }
    .stats-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--parchment); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    .stat-card .stat-num { font-size: 22px; font-weight: 700; font-family: Fraunces, serif; line-height: 1.15; }
    .stat-card .stat-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin-top: 2px; }
    .order-card { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
    .order-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 15px 20px; background: var(--parchment); border-bottom: 1px solid var(--line); }
    .order-head h4 { margin: 0; font-size: 15px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .order-head .meta { font-size: 12px; font-weight: 400; color: var(--muted); }
    .status { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-paid { background: #d4edda; color: #155724; }
    .status-confirmed { background: #cce5ff; color: #004085; }
    .status-shipped { background: #d1ecf1; color: #0c5460; }
    .status-delivered { background: #d4edda; color: #155724; }
    .status-cancelled { background: #f8d7da; color: #721c24; }
    .status-disputed { background: #f8d7da; color: #721c24; }
    .order-body { padding: 20px; }
    .order-items { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .order-item { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; }
    .order-item > span:last-child { white-space: nowrap; font-weight: 600; }
    .order-total { font-weight: 700; font-size: 15px; border-top: 1px dashed var(--line); padding-top: 15px; margin-top: 15px; display: flex; justify-content: space-between; gap: 10px; }
    .order-actions { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    .btn { padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; }
    .btn-primary { background: var(--wood-med); color: #fff; }
    .btn-success { background: var(--green); color: #fff; }
    .btn-sm { padding: 6px 12px; font-size: 11px; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .empty-state { text-align: center; padding: 60px 20px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
    .empty-state .empty-icon { font-size: 48px; opacity: .6; margin-bottom: 10px; }
    .empty-state h3 { font-family: Fraunces, serif; margin: 0 0 6px; }
    .empty-state p { color: var(--muted); margin: 0; font-size: 13px; }
    .msg { margin-top: 15px; text-align: center; font-weight: 600; min-height: 20px; }
    .msg.ok { color: var(--green); }
    .msg.err { color: var(--red); }
    .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .chip { padding: 6px 14px; border-radius: 999px; background: #fff; color: var(--ink-2); font-size: 12px; font-weight: 600; border: 1px solid var(--line-2); cursor: pointer; }
    .chip.active { background: var(--wood-med); color: #fff; border-color: var(--wood-med); }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-main">
      <a class="brand" href="/">
        <span class="brand-mark">🪵</span>
        <span class="brand-text">Builder<em>Wood</em><small>Seller Dashboard</small></span>
      </a>
      <a class="catnav-quote" href="/" style="margin-left:auto;padding:8px 14px;color:var(--gold-2);font-weight:700;">← Back to shop</a>
    </div>
  </header>

  <main class="dashboard-page">
    <div class="dash-header">
      <h2>My Orders</h2>
      <button class="btn btn-primary btn-sm" id="refresh-btn" type="button">↻ Refresh</button>
    </div>

    <div class="nav-tabs">
      <a href="/seller/upload">Upload Wood</a>
      <a href="/seller/products">My Products</a>
      <a href="/seller/orders" class="active">My Orders</a>
      <a href="/seller/payout">Payout Account</a>
      <a href="/seller/wallet-page">💰 Wallet</a>
      <a href="/messages">💬 Messages</a>
    </div>

    <section class="stats-strip" id="stats-strip"></section>

    <div class="filters">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="pending">Pending</button>
      <button class="chip" data-filter="confirmed">Confirmed</button>
      <button class="chip" data-filter="shipped">Shipped</button>
      <button class="chip" data-filter="delivered">Delivered</button>
    </div>

    <div id="orders-list"></div>
    <div class="msg" id="msg" role="status"></div>
  </main>

  <script>
    const token = localStorage.getItem("bw_token");
    if (!token) window.location.replace("/login");

    let allOrders = [];
    let activeFilter = "all";
    let pendingOrderId = null;

    function fmtGHS(v) {
      const n = Number(v);
      return "GH₵ " + (Number.isFinite(n) ? n.toFixed(2) : "0.00");
    }
    function esc(v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function showMsg(text, isError) {
      const msg = document.getElementById("msg");
      msg.textContent = text;
      msg.className = "msg " + (isError ? "err" : "ok");
      clearTimeout(showMsg._t);
      showMsg._t = setTimeout(() => { msg.textContent = ""; }, 5000);
    }

    async function loadOrders() {
      document.getElementById("orders-list").innerHTML = '<p class="empty-state">Loading...</p>';
      try {
        const res = await fetch("/orders/seller/orders", { headers: { "Authorization": `Bearer ${token}` } });
        if (res.status === 401) { window.location.href = "/login"; return; }
        if (!res.ok) throw new Error("Failed");
        allOrders = await res.json();
        renderStats();
        renderOrders();
      } catch (e) {
        showMsg("Could not load orders", true);
      }
    }

    function renderStats() {
      const pending = allOrders.filter(o => ["pending", "paid", "confirmed"].includes(o.status)).length;
      const shipped = allOrders.filter(o => o.status === "shipped").length;
      const delivered = allOrders.filter(o => o.status === "delivered").length;
      const revenue = allOrders.filter(o => ["paid", "confirmed", "shipped", "delivered"].includes(o.status))
        .reduce((sum, o) => sum + Number(o.total_price || 0), 0);
      document.getElementById("stats-strip").innerHTML = `
        <div class="stat-card"><div class="stat-num">${allOrders.length}</div><div class="stat-label">Total Orders</div></div>
        <div class="stat-card"><div class="stat-num">${pending}</div><div class="stat-label">Pending</div></div>
        <div class="stat-card"><div class="stat-num">${shipped}</div><div class="stat-label">Shipped</div></div>
        <div class="stat-card"><div class="stat-num">${delivered}</div><div class="stat-label">Delivered</div></div>
        <div class="stat-card"><div class="stat-num">${fmtGHS(revenue)}</div><div class="stat-label">Revenue</div></div>`;
    }

    function renderOrders() {
      let filtered = allOrders;
      if (activeFilter !== "all") filtered = filtered.filter(o => o.status === activeFilter);
      const host = document.getElementById("orders-list");
      if (!filtered.length) {
        host.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div><h3>${activeFilter === "all" ? "No orders yet" : "No " + activeFilter + " orders"}</h3><p>When customers buy your wood, orders will appear here.</p></div>`;
        return;
      }
      host.innerHTML = filtered.map(o => {
        const items = (o.items || []).map(i => `
          <div class="order-item">
            <span>${esc(i.wood_name_snap)} — ${esc(i.size_snap)}</span>
            <span>${i.quantity} × ${fmtGHS(i.price_at_purchase)}</span>
          </div>`).join("");
        let actions = "";
        if (o.status === "confirmed" || o.status === "paid") {
          actions = `<div class="order-actions"><button class="btn btn-primary btn-sm" onclick="updateStatus(${o.order_id}, 'shipped')" ${pendingOrderId === o.order_id ? "disabled" : ""}>Mark Shipped</button></div>`;
        } else if (o.status === "shipped") {
          actions = `<div class="order-actions"><button class="btn btn-success btn-sm" onclick="updateStatus(${o.order_id}, 'delivered')" ${pendingOrderId === o.order_id ? "disabled" : ""}>Mark Delivered</button></div>`;
        }
        return `
          <div class="order-card">
            <div class="order-head">
              <h4>Order #${o.order_id} <span class="meta">${new Date(o.order_date || Date.now()).toLocaleDateString()}</span></h4>
              <span class="status status-${esc(o.status)}">${esc(o.status)}</span>
            </div>
            <div class="order-body">
              <div class="order-items">${items}</div>
              <div class="order-total"><span>Total</span><span>${fmtGHS(o.total_price)}</span></div>
              ${actions}
            </div>
          </div>`;
      }).join("");
    }

    async function updateStatus(orderId, newStatus) {
      if (pendingOrderId) return;
      const verb = newStatus === "shipped" ? "mark as shipped" : "mark as delivered";
      if (!confirm(`Are you sure you want to ${verb} order #${orderId}?`)) return;
      pendingOrderId = orderId;
      renderOrders();
      try {
        const res = await fetch(`/orders/${orderId}/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ status: newStatus }),
        });
        if (res.status === 401) { window.location.href = "/login"; return; }
        if (res.ok) {
          showMsg(`Order #${orderId} marked as ${newStatus}`, false);
          pendingOrderId = null;
          await loadOrders();
        } else {
          const e = await res.json().catch(() => ({}));
          showMsg(e.detail || "Failed to update", true);
          pendingOrderId = null;
          renderOrders();
        }
      } catch {
        showMsg("Network error", true);
        pendingOrderId = null;
        renderOrders();
      }
    }

    document.querySelectorAll(".chip[data-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        document.querySelectorAll(".chip[data-filter]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderOrders();
      });
    });

    document.getElementById("refresh-btn").addEventListener("click", loadOrders);
    window.updateStatus = updateStatus;
    loadOrders();
  </script>
</body>
</html>
