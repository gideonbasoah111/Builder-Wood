<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>My Orders — Builder Wood</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">

  <style>
    :root {
      --tap: 44px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: hidden; }

    body {
      padding-top: max(0px, var(--safe-t));
      padding-bottom: max(0px, var(--safe-b));
      padding-left: max(0px, var(--safe-l));
      padding-right: max(0px, var(--safe-r));
    }

    .orders-page {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow-wrap: anywhere;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    .page-header h2 { font-family: Fraunces, serif; margin: 0; }

    .header-main { flex-wrap: wrap; gap: 12px; }
    .header-main .catnav-quote { margin-left: auto; }
    @media (max-width: 480px) {
      .header-main .catnav-quote { margin-left: 0; padding: 8px 0; }
    }

    .order-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
      min-width: 0;
    }
    .order-card > * { min-width: 0; }

    .order-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 15px 20px;
      background: var(--parchment);
      border-bottom: 1px solid var(--line);
    }
    .order-head h4 {
      margin: 0;
      font-size: 15px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      overflow-wrap: anywhere;
    }
    .order-head h4 .date {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }
    .order-head .status {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    .status-pending   { background: #fff3cd; color: #856404; }
    .status-confirmed { background: #cce5ff; color: #004085; }
    .status-shipped   { background: #d1ecf1; color: #0c5460; }
    .status-delivered { background: #d4edda; color: #155724; }
    .status-cancelled { background: #f8d7da; color: #721c24; }

    .order-body { padding: 20px; }
    .order-items { margin-bottom: 15px; }

    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      font-size: 13px;
      padding: 12px 0;
      border-bottom: 1px dashed var(--line);
      flex-wrap: wrap;
    }
    .order-item:last-child { border-bottom: none; }

    .item-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .item-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--ink);
      overflow-wrap: anywhere;
    }
    .item-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .item-size {
      font-size: 11px;
      background: var(--parchment-2);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--ink-2);
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .item-qty { font-size: 12px; color: var(--wood-med); font-weight: 700; }
    .item-price {
      font-weight: 800;
      font-size: 14px;
      color: var(--ink);
      white-space: nowrap;
      overflow-wrap: anywhere;
      flex: 0 0 auto;
    }

    .order-totals {
      margin-top: 15px;
      border-top: 2px solid var(--line);
      padding-top: 15px;
    }
    .total-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .total-row.grand-total {
      font-weight: 800;
      font-size: 16px;
      color: var(--ink);
      margin-top: 8px;
    }

    .order-meta {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .order-meta > span { overflow-wrap: anywhere; min-width: 0; }

    .order-meta .meta-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-receipt,
    .btn-msg {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: var(--tap);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s;
      cursor: pointer;
    }

    .btn-receipt {
      background: var(--wood-med);
      color: #fff;
      text-decoration: none;
      border: 0;
    }
    .btn-receipt:hover { background: var(--wood-dark); }

    .btn-msg {
      background: #fff;
      color: var(--wood-med);
      border: 1px solid var(--wood-med);
    }
    .btn-msg:hover { background: var(--parchment-2); }
    .btn-msg:disabled { opacity: .55; cursor: not-allowed; }

    @media (max-width: 720px) {
      .orders-page { margin: 24px 12px; padding: 22px 18px; border-radius: 12px; }
      .order-body { padding: 16px; }
      .order-head { padding: 12px 16px; }
    }

    @media (max-width: 520px) {
      .order-head { flex-direction: column; align-items: flex-start; }
      .order-head .status { align-self: flex-end; }
      .order-item { flex-direction: column; gap: 6px; }
      .item-price { align-self: flex-end; }
      .order-meta { flex-direction: column; align-items: stretch; gap: 12px; }
      .order-meta .meta-actions { width: 100%; }
      .btn-receipt, .btn-msg { width: 100%; }
    }

    @media (max-width: 360px) {
      .orders-page { margin: 12px 8px; padding: 16px 12px; }
      .page-header h2 { font-size: 20px; }
      .order-head h4 { font-size: 14px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-main">
      <a class="brand" href="/">
        <span class="brand-mark">🪵</span>
        <span class="brand-text">Builder<em>Wood</em><small>My Orders</small></span>
      </a>
      <a class="catnav-quote" href="/"
         style="padding:8px 0;color:var(--gold-2);font-weight:700;">← Back to shop</a>
    </div>
  </header>

  <main class="orders-page">
    <div class="page-header">
      <h2>My Orders</h2>
    </div>

    <div id="orders-list">
      <p style="text-align:center; color:var(--muted);">Loading your orders...</p>
    </div>
  </main>

  <script>
    'use strict';

    (function () {
      const token = localStorage.getItem("bw_token");
      if (!token) { window.location.href = "/login"; return; }

      const list = document.getElementById("orders-list");

      function escapeHtml(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
      }

      function money(v) {
        const n = Number(v);
        return Number.isFinite(n) ? "GH₵ " + n.toFixed(2) : "—";
      }

      function statusLabel(s) {
        const v = String(s || "").toLowerCase();
        return v ? v.charAt(0).toUpperCase() + v.slice(1) : "Unknown";
      }

      async function messageSeller(sellerId, orderId, btn) {
        if (!sellerId || !orderId) return;
        const token = localStorage.getItem("bw_token");
        if (!token) { window.location.href = "/login"; return; }

        btn.disabled = true;
        const original = btn.innerHTML;
        btn.innerHTML = "Opening chat…";

        try {
          const res = await fetch("/conversations/start", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`,
            },
            body: JSON.stringify({ seller_id: sellerId, order_id: orderId }),
          });

          if (res.status === 401) { window.location.href = "/login"; return; }

          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(
            typeof data.detail === "string" ? data.detail : `HTTP ${res.status}`
          );

          window.location.href = `/messages/${data.conversation_id}`;
        } catch (err) {
          btn.disabled = false;
          btn.innerHTML = original;
          alert(err.message || "Could not open the conversation.");
        }
      }

      async function loadOrders() {
        try {
          const res = await fetch("/orders/my-orders", {
            headers: { Authorization: "Bearer " + token },
          });

          if (res.status === 401) {
            window.location.href = "/login";
            return;
          }
          if (!res.ok) throw new Error("HTTP " + res.status);

          const orders = await res.json();

          if (!Array.isArray(orders) || orders.length === 0) {
            list.innerHTML =
              '<p style="text-align:center; color:var(--muted);">' +
                "You have not placed any orders yet.<br><br>" +
                '<a href="/" style="color:var(--wood-med);font-weight:700;">Start shopping →</a>' +
              "</p>";
            return;
          }

          list.innerHTML = orders.map((o) => {
            const statusClass = "status-" + String(o.status || "").toLowerCase();
            const dateText = o.order_date
              ? new Date(o.order_date).toLocaleDateString()
              : "";

            const itemsHtml = (o.items || []).map((item) => {
              const sizeText =
                item.size_snap && item.size_snap !== "None"
                  ? item.size_snap
                  : "Standard Size";
              const qty = Number(item.quantity) || 0;
              const lineTotal = (Number(item.price_at_purchase) || 0) * qty;

              return (
                '<div class="order-item">' +
                  '<div class="item-details">' +
                    '<span class="item-name">' +
                      escapeHtml(item.wood_name_snap || "Timber") +
                    "</span>" +
                    '<div class="item-meta">' +
                      '<span class="item-size">Size: ' +
                        escapeHtml(sizeText) +
                      "</span>" +
                      '<span class="item-qty">Qty: ' + qty + "</span>" +
                    "</div>" +
                  "</div>" +
                  '<div class="item-price">' + money(lineTotal) + "</div>" +
                "</div>"
              );
            }).join("");

            const canMessage = Boolean(o.seller_id && o.order_id);

            return (
              '<div class="order-card">' +
                '<div class="order-head">' +
                  "<h4>Order #" + escapeHtml(o.order_id) +
                    (dateText
                      ? ' <span class="date">' + escapeHtml(dateText) + "</span>"
                      : "") +
                  "</h4>" +
                  '<span class="status ' + escapeHtml(statusClass) + '">' +
                    escapeHtml(statusLabel(o.status)) +
                  "</span>" +
                "</div>" +
                '<div class="order-body">' +
                  '<div class="order-items">' + itemsHtml + "</div>" +
                  '<div class="order-totals">' +
                    '<div class="total-row">' +
                      "<span>Subtotal</span>" +
                      "<span>" + money(o.subtotal) + "</span>" +
                    "</div>" +
                    '<div class="total-row">' +
                      "<span>Delivery Fee</span>" +
                      "<span>" + money(o.delivery_fee) + "</span>" +
                    "</div>" +
                    '<div class="total-row grand-total">' +
                      "<span>Total</span>" +
                      "<span>" + money(o.total_price) + "</span>" +
                    "</div>" +
                  "</div>" +
                  '<div class="order-meta">' +
                    "<span>📍 Delivering to: " +
                      escapeHtml(o.delivery_address || "—") +
                    "</span>" +
                    '<div class="meta-actions">' +
                      (canMessage
                        ? '<button type="button" class="btn-msg"' +
                            ' data-seller-id="' + escapeHtml(o.seller_id) + '"' +
                            ' data-order-id="' + escapeHtml(o.order_id) + '">' +
                            '💬 Message Seller' +
                          '</button>'
                        : "") +
                      '<a href="/order/' + encodeURIComponent(o.order_id) +
                        '" class="btn-receipt">View Receipt</a>' +
                    "</div>" +
                  "</div>" +
                "</div>" +
              "</div>"
            );
          }).join("");

          list.querySelectorAll(".btn-msg").forEach((btn) => {
            btn.addEventListener("click", () => {
              messageSeller(
                Number(btn.dataset.sellerId),
                Number(btn.dataset.orderId),
                btn
              );
            });
          });
        } catch (err) {
          list.innerHTML =
            '<p style="text-align:center; color:var(--red);">Error loading orders.</p>';
          console.error(err);
        }
      }

      loadOrders();
    })();
  </script>
</body>
</html>
