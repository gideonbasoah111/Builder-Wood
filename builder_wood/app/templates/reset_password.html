<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — Builder Wood</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .auth-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--parchment);
    }
    .auth-card {
      background: #fff; border: 1px solid var(--line); border-radius: 16px;
      padding: 40px; max-width: 420px; width: 100%; box-shadow: var(--shadow-md);
    }
    .auth-card h1 {
      font-family: Fraunces, serif; font-size: 26px; margin: 0 0 6px;
      color: var(--ink); letter-spacing: -0.3px;
    }
    .auth-card p.sub {
      color: var(--muted); font-size: 13.5px; margin: 0 0 24px;
      line-height: 1.5;
    }
    .field { margin-bottom: 16px; }
    .field label {
      display: block; font-size: 12.5px; font-weight: 700;
      margin-bottom: 6px; color: var(--ink-2);
    }
    .password-field { position: relative; }
    .password-field input {
      width: 100%; padding: 12px 48px 12px 14px; border: 1.5px solid var(--line-2);
      border-radius: 8px; font: inherit; font-size: 14px; outline: 0;
      transition: border-color 0.15s;
    }
    .password-field input:focus { border-color: var(--wood-med); }
    .password-toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      background: transparent; border: 0; padding: 6px 10px;
      cursor: pointer; font-size: 16px; color: var(--muted);
      border-radius: 6px; transition: background 0.15s, color 0.15s;
    }
    .password-toggle:hover { color: var(--wood-med); background: var(--parchment); }
    .submit-btn {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: var(--wood-med); color: #fff; font-weight: 700;
      font-size: 14px; cursor: pointer; transition: background 0.15s;
    }
    .submit-btn:hover { background: var(--wood-dark); }
    .submit-btn:disabled { background: #c7bfb1; cursor: not-allowed; }
    .msg {
      margin-top: 16px; padding: 12px 14px; border-radius: 8px;
      font-size: 13px; line-height: 1.5; display: none;
    }
    .msg.show { display: block; }
    .msg.ok { background: #d4edda; color: #155724; }
    .msg.err { background: #f8d7da; color: #721c24; }
    .strength-meter {
      height: 4px; border-radius: 2px; background: #e2d3b9;
      margin-top: 6px; overflow: hidden;
    }
    .strength-meter-fill {
      height: 100%; width: 0; transition: width 0.2s, background 0.2s;
    }
    .strength-text { font-size: 11px; margin-top: 4px; color: var(--muted); }
    .back-link {
      display: inline-block; margin-top: 20px; font-size: 13px;
      color: var(--wood-med); text-decoration: none; font-weight: 600;
    }
    .back-link:hover { color: var(--wood-dark); }
    .invalid-state { display: none; text-align: center; padding: 20px 0; }
    .invalid-state.show { display: block; }
    .invalid-state .icon { font-size: 48px; margin-bottom: 12px; }
    .invalid-state h2 {
      font-family: Fraunces, serif; font-size: 20px; margin: 0 0 8px;
      color: var(--red);
    }
    .invalid-state p { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div id="valid-state">
        <h1>Set a new password</h1>
        <p class="sub">Choose a strong password for your account.</p>

        <form id="reset-form">
          <div class="field">
            <label for="new-password">New password</label>
            <div class="password-field">
              <input id="new-password" type="password" required
                     minlength="6" autocomplete="new-password"
                     placeholder="At least 6 characters">
              <button type="button" class="password-toggle"
                      onclick="togglePassword('new-password', this)"
                      aria-label="Show password">👁</button>
            </div>
            <div class="strength-meter">
              <div class="strength-meter-fill" id="strength-fill"></div>
            </div>
            <div class="strength-text" id="strength-text"></div>
          </div>

          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <div class="password-field">
              <input id="confirm-password" type="password" required
                     minlength="6" autocomplete="new-password"
                     placeholder="Re-enter password">
              <button type="button" class="password-toggle"
                      onclick="togglePassword('confirm-password', this)"
                      aria-label="Show password">👁</button>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">
            Reset Password
          </button>
        </form>

        <div class="msg" id="msg"></div>
        <a href="/login" class="back-link">← Back to login</a>
      </div>

      <div class="invalid-state" id="invalid-state">
        <div class="icon">⚠️</div>
        <h2>Invalid reset link</h2>
        <p>This link may have expired or already been used.</p>
        <a href="/forgot-password" class="back-link">Request a new reset link</a>
      </div>
    </div>
  </div>

  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
        btn.setAttribute("aria-label", "Hide password");
      } else {
        input.type = "password";
        btn.textContent = "👁";
        btn.setAttribute("aria-label", "Show password");
      }
    }

    // Get token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      document.getElementById("valid-state").style.display = "none";
      document.getElementById("invalid-state").classList.add("show");
    }

    // Password strength meter
    const newPassword = document.getElementById("new-password");
    const strengthFill = document.getElementById("strength-fill");
    const strengthText = document.getElementById("strength-text");

    newPassword.addEventListener("input", () => {
      const val = newPassword.value;
      let strength = 0;
      if (val.length >= 6) strength++;
      if (val.length >= 10) strength++;
      if (/[A-Z]/.test(val)) strength++;
      if (/[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;

      const widths = ["0%", "20%", "40%", "60%", "80%", "100%"];
      const colors = ["#e2d3b9", "#b13a2e", "#d68910", "#c99348", "#3d6b4a", "#2d5239"];
      const labels = ["", "Very weak", "Weak", "Fair", "Good", "Strong"];

      strengthFill.style.width = widths[strength];
      strengthFill.style.background = colors[strength];
      strengthText.textContent = labels[strength] || "";
      strengthText.style.color = colors[strength];
    });

    const form = document.getElementById("reset-form");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";

      const pwd = newPassword.value;
      const confirm = document.getElementById("confirm-password").value;

      if (pwd !== confirm) {
        msg.textContent = "Passwords do not match.";
        msg.className = "msg show err";
        return;
      }

      if (pwd.length < 6) {
        msg.textContent = "Password must be at least 6 characters.";
        msg.className = "msg show err";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Resetting...";

      try {
        const res = await fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, new_password: pwd }),
        });
        const data = await res.json();

        if (res.ok) {
          msg.textContent = "✅ Password reset successfully! Redirecting to login...";
          msg.className = "msg show ok";
          setTimeout(() => window.location.href = "/login", 2000);
        } else {
          msg.textContent = data.detail || "Failed to reset password.";
          msg.className = "msg show err";
        }
      } catch (err) {
        msg.textContent = "Network error. Check your connection.";
        msg.className = "msg show err";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Reset Password";
      }
    });
  </script>
</body>
</html>
