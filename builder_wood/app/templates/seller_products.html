<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Products — Builder Wood</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .dashboard-page { max-width: 1100px; margin: 40px auto; padding: 30px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); }
    .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
    .dash-header h2 { font-family: Fraunces, serif; margin: 0; }
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .nav-tabs a { color: var(--muted); font-weight: 600; text-decoration: none; padding: 10px 6px; border-bottom: 2px solid transparent; }
    .nav-tabs a.active { color: var(--wood-med); border-bottom-color: var(--wood-med); }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .product-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .product-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: var(--parchment); }
    .product-card .body { padding: 12px; }
    .product-card h4 { font-size: 14px; margin: 0 0 4px; }
    .product-card .meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .product-card .price { font-family: Fraunces, serif; font-size: 16px; font-weight: 700; color: var(--wood-med); }
    .product-card .stock { font-size: 11px; color: var(--green); margin-top: 4px; }
    .product-card .stock.out { color: var(--red); }
    .empty-text { text-align: center; padding: 40px; color: var(--muted); }
    .btn { padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
    .btn-primary { background: var(--wood-med); color: #fff; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-main">
      <a class="brand" href="/">
        <span class="brand-mark">🪵</span>
        <span class="brand-text">Builder<em>Wood</em><small>Seller Dashboard</small></span>
      </a>
      <a class="catnav-quote" href="/" style="margin-left:auto;padding:8px 14px;color:var(--gold-2);font-weight:700;">← Back to shop</a>
    </div>
  </header>

  <main class="dashboard-page">
    <div class="dash-header">
      <h2>My Products</h2>
      <a href="/seller/upload" class="btn btn-primary">+ Upload New Wood</a>
    </div>

    <div class="nav-tabs">
      <a href="/seller/upload">Upload Wood</a>
      <a href="/seller/products" class="active">My Products</a>
      <a href="/seller/orders">My Orders</a>
      <a href="/seller/payout">Payout Account</a>
      <a href="/seller/wallet-page">💰 Wallet</a>
      <a href="/messages">💬 Messages</a>
    </div>

    <div id="products-grid" class="product-grid">
      <p class="empty-text">Loading...</p>
    </div>
  </main>

  <script>
    const token = localStorage.getItem("bw_token");
    if (!token) window.location.replace("/login");

    function fmtGHS(v) {
      const n = Number(v);
      return "GH₵ " + (Number.isFinite(n) ? n.toFixed(2) : "0.00");
    }

    async function loadProducts() {
      try {
        const res = await fetch("/woods/?seller=me", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        if (!res.ok) throw new Error("Failed");
        const items = await res.json();
        const rows = Array.isArray(items) ? items : (items.items || []);

        const host = document.getElementById("products-grid");
        if (!rows.length) {
          host.innerHTML = '<p class="empty-text" style="grid-column: 1 / -1;">No products yet. <a href="/seller/upload" style="color:var(--wood-med);font-weight:700;">Upload your first wood →</a></p>';
          return;
        }

        host.innerHTML = rows.map(p => {
          const img = p.image_url || (p.images && p.images[0] && p.images[0].image_url) || "";
          const stock = Number(p.stock_quantity || 0);
          return `
            <article class="product-card">
              ${img ? `<img src="${img}" alt="">` : `<div style="aspect-ratio:1/1;display:grid;place-items:center;font-size:40px;background:var(--parchment);">🪵</div>`}
              <div class="body">
                <h4>${p.local_name || "Timber"} ${p.size_label || ""}</h4>
                <div class="meta">${p.category_name || p.trade_name || "Timber"}</div>
                <div class="price">${fmtGHS(p.price_per_piece)}</div>
                <div class="stock ${stock <= 0 ? 'out' : ''}">${stock <= 0 ? 'Out of stock' : stock + ' in stock'}</div>
              </div>
            </article>
          `;
        }).join("");
      } catch (e) {
        document.getElementById("products-grid").innerHTML = '<p class="empty-text" style="grid-column: 1 / -1;color:var(--red);">Error loading products.</p>';
      }
    }

    loadProducts();
  </script>
</body>
</html>
