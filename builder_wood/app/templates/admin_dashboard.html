<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin Dashboard — Builder Wood</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .admin-page { max-width: 900px; margin: 40px auto; padding: 30px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); }
    .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 20px; }
    .admin-header h2 { font-family: Fraunces, serif; margin: 0; }
    .btn { padding: 10px 16px; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-block; cursor: pointer; border: none; }
    .btn-primary { background: var(--wood-med); color: white; }
    .btn-danger { background: var(--red); color: white; }
    .btn-success { background: var(--green); color: white; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }

    .user-card { display: flex; justify-content: space-between; align-items: center; padding: 16px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
    .user-info h4 { margin: 0 0 4px; font-size: 16px; }
    .user-info p { margin: 0; color: var(--muted); font-size: 13px; }

    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-active { background: #d4edda; color: #155724; }
    .status-inactive { background: #f8d7da; color: #721c24; }

    .msg { margin-top: 15px; font-weight: 600; color: var(--green); text-align: center; }
    .nav-tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
    .nav-tabs a { color: var(--muted); font-weight: 600; text-decoration: none; padding: 10px 5px; cursor: pointer; border-bottom: 2px solid transparent; }
    .nav-tabs a.active { color: var(--wood-med); border-bottom-color: var(--wood-med); }
    .empty-text { color: var(--muted); text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-main">
      <a class="brand" href="/">
        <span class="brand-mark">🪵</span>
        <span class="brand-text">Builder<em>Wood</em><small>Admin Control</small></span>
      </a>
      <a class="catnav-quote" href="/" style="margin-left:auto;padding:8px 14px;color:var(--gold-2);font-weight:700;">← Back to shop</a>
    </div>
  </header>

  <main class="admin-page">
    <div class="admin-header">
      <h2>Admin Dashboard</h2>
      <a href="/seller/upload" class="btn btn-primary">+ Upload My Own Wood</a>
    </div>

    <div class="nav-tabs">
      <a class="active" onclick="switchTab('pending')" id="tab-pending">Pending Sellers</a>
      <a onclick="switchTab('active')" id="tab-active">Active Sellers</a>
      <a onclick="switchTab('customers')" id="tab-customers">Customers</a>
    </div>

    <div id="list-container">
      <p class="empty-text">Loading...</p>
    </div>

    <div class="msg" id="msg"></div>
  </main>

  <script>
    const token = localStorage.getItem("bw_token");
    if (!token) window.location.href = "/login";

    const msg = document.getElementById("msg");
    const listContainer = document.getElementById("list-container");
    let currentTab = "pending";

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll(".nav-tabs a").forEach(a => a.classList.remove("active"));
        document.getElementById("tab-" + tab).classList.add("active");
        loadData();
    }

    async function loadData() {
        listContainer.innerHTML = '<p class="empty-text">Loading...</p>';
        msg.textContent = "";

        let endpoint = "";
        if (currentTab === "pending") endpoint = "/admin/pending-sellers";
        if (currentTab === "active") endpoint = "/admin/active-sellers";
        if (currentTab === "customers") endpoint = "/admin/customers";

        try {
            const res = await fetch(endpoint, {
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (!res.ok) throw new Error("Failed");
            const users = await res.json();

            if (users.length === 0) {
                listContainer.innerHTML = '<p class="empty-text">No users found in this category.</p>';
                return;
            }

            listContainer.innerHTML = users.map(u => {
                let badge = "";
                let actionBtn = "";

                if (currentTab === "pending") {
                    badge = `<span class="status-badge status-pending">Pending</span>`;
                    actionBtn = `<button class="btn btn-success btn-sm" onclick="toggleUser(${u.user_id})">Approve</button>`;
                } else if (currentTab === "active") {
                    badge = `<span class="status-badge status-active">Active</span>`;
                    actionBtn = `<button class="btn btn-danger btn-sm" onclick="toggleUser(${u.user_id})">Deactivate</button>`;
                } else {
                    badge = `<span class="status-badge status-active">Customer</span>`;
                    // No action button for customers for now
                }

                return `
                    <div class="user-card">
                        <div class="user-info">
                            <h4>${u.name} ${badge}</h4>
                            <p>${u.email} · ${u.phone_number || 'No phone'}</p>
                            ${u.company_name ? `<p style="margin-top:4px; font-size:12px; color:var(--wood-med);">${u.company_name}</p>` : ""}
                        </div>
                        <div>${actionBtn}</div>
                    </div>
                `;
            }).join("");

        } catch (err) {
            listContainer.innerHTML = `<p class="empty-text" style="color:var(--red);">Error loading data.</p>`;
        }
    }

    async function toggleUser(id) {
        if (!confirm("Are you sure you want to change this user's status?")) return;

        try {
            const res = await fetch(`/admin/users/${id}/toggle-active`, {
                method: "PATCH",
                headers: { "Authorization": `Bearer ${token}` }
            });

            if (res.ok) {
                msg.textContent = "User status updated successfully!";
                msg.style.color = "var(--green)";
                loadData(); // refresh list
            } else {
                const err = await res.json();
                msg.textContent = err.detail || "Failed to update user.";
                msg.style.color = "var(--red)";
            }
        } catch (err) {
            msg.textContent = "Network error.";
            msg.style.color = "var(--red)";
        }
    }

    // Initial load
    loadData();
  </script>
</body>
</html>
