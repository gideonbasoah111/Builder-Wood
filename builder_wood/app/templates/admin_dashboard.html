<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Admin Dashboard — Builder Wood</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    :root {
      --tap: 44px;
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body { margin: 0; }

    .admin-page {
      width: 100%;
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      padding-left: max(30px, calc(30px + var(--safe-l)));
      padding-right: max(30px, calc(30px + var(--safe-r)));
      padding-bottom: max(30px, calc(30px + var(--safe-b)));
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      margin-bottom: 20px;
    }
    .admin-header h2 { font-family: Fraunces, serif; margin: 0; }

    /* ---------- buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: var(--tap);
      padding: 10px 16px;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary { background: var(--wood-med); color: #fff; }
    .btn-danger  { background: var(--red);       color: #fff; }
    .btn-success { background: var(--green);     color: #fff; }
    .btn-sm      { min-height: 36px; padding: 6px 12px; font-size: 13px; }

    @media (hover: hover) {
      .btn-primary:hover { background: var(--wood-dark, #3e2c24); }
      .btn-danger:hover  { filter: brightness(0.92); }
      .btn-success:hover { filter: brightness(0.92); }
    }

    /* ---------- tabs ---------- */
    .nav-tabs {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;              /* Firefox */
      -ms-overflow-style: none;           /* old Edge */
    }
    .nav-tabs::-webkit-scrollbar { display: none; } /* Chrome/Safari */

    .nav-tabs a {
      flex: 0 0 auto;
      color: var(--muted);
      font-weight: 600;
      text-decoration: none;
      padding: 12px 6px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-tabs a.active {
      color: var(--wood-med);
      border-bottom-color: var(--wood-med);
    }

    /* ---------- user cards ---------- */
    .user-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      margin-bottom: 12px;
      min-width: 0;                       /* allow children to shrink */
    }
    .user-info { min-width: 0; flex: 1 1 auto; }
    .user-info h4 {
      margin: 0 0 4px;
      font-size: 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      word-break: break-word;
    }
    .user-info p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .user-info .company {
      margin-top: 4px;
      font-size: 12px;
      color: var(--wood-med);
      overflow-wrap: anywhere;
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .status-pending  { background: #fff3cd; color: #856404; }
    .status-active   { background: #d4edda; color: #155724; }
    .status-inactive { background: #f8d7da; color: #721c24; }

    .msg {
      margin-top: 15px;
      font-weight: 600;
      color: var(--green);
      text-align: center;
      min-height: 1.2em;
    }
    .empty-text {
      color: var(--muted);
      text-align: center;
      padding: 20px;
    }

    /* ---------- tablets ---------- */
    @media (max-width: 720px) {
      .admin-page {
        margin: 20px 12px;
        padding: 20px 16px;
        border-radius: 12px;
      }
      .admin-header { padding-bottom: 16px; margin-bottom: 16px; }
    }

    /* ---------- phones ---------- */
    @media (max-width: 520px) {
      .admin-header {
        flex-direction: column;
        align-items: stretch;
      }
      .admin-header h2 { font-size: 22px; }
      .admin-header .btn { width: 100%; }

      .user-card {
        flex-direction: column;
        align-items: stretch;
      }
      .user-card .btn {
        width: 100%;
      }

      .nav-tabs { gap: 14px; }
    }

    /* ---------- very narrow (small phones) ---------- */
    @media (max-width: 360px) {
      .admin-page { padding: 16px 12px; }
      .user-info h4 { font-size: 15px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header-main">
      <a class="brand" href="/">
        <span class="brand-mark">🪵</span>
        <span class="brand-text">Builder<em>Wood</em><small>Admin Control</small></span>
      </a>
      <a class="catnav-quote" href="/" style="margin-left:auto;padding:8px 14px;color:var(--gold-2);font-weight:700;">← Back to shop</a>
    </div>
  </header>

  <main class="admin-page">
    <div class="admin-header">
      <h2>Admin Dashboard</h2>
      <a href="/seller/upload" class="btn btn-primary">+ Upload My Own Wood</a>
    </div>

    <div class="nav-tabs" role="tablist">
      <a class="active" id="tab-pending"   role="tab" onclick="switchTab('pending')">Pending Sellers</a>
      <a id="tab-active"    role="tab" onclick="switchTab('active')">Active Sellers</a>
      <a id="tab-customers" role="tab" onclick="switchTab('customers')">Customers</a>
    </div>

    <div id="list-container">
      <p class="empty-text">Loading...</p>
    </div>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      const token = localStorage.getItem("bw_token");
      if (!token) { window.location.href = "/login"; return; }

      const msg = document.getElementById("msg");
      const listContainer = document.getElementById("list-container");
      let currentTab = "pending";

      const ENDPOINTS = {
        pending:   "/admin/pending-sellers",
        active:    "/admin/active-sellers",
        customers: "/admin/customers",
      };

      function setMsg(text, color) {
        msg.textContent = text;
        msg.style.color = color;
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
      }

      window.switchTab = function (tab) {
        currentTab = tab;
        document.querySelectorAll(".nav-tabs a").forEach((a) => a.classList.remove("active"));
        const activeTab = document.getElementById("tab-" + tab);
        if (activeTab) activeTab.classList.add("active");
        loadData();
      };

      async function loadData() {
        listContainer.innerHTML = '<p class="empty-text">Loading...</p>';
        setMsg("", "");

        try {
          const res = await fetch(ENDPOINTS[currentTab], {
            headers: { Authorization: "Bearer " + token },
          });

          if (res.status === 401) {
            window.location.href = "/login";
            return;
          }
          if (!res.ok) throw new Error("HTTP " + res.status);

          const users = await res.json();

          if (!Array.isArray(users) || users.length === 0) {
            listContainer.innerHTML =
              '<p class="empty-text">No users found in this category.</p>';
            return;
          }

          listContainer.innerHTML = users.map((u) => {
            let badge = "";
            let actionBtn = "";

            if (currentTab === "pending") {
              badge = '<span class="status-badge status-pending">Pending</span>';
              actionBtn =
                '<button class="btn btn-success btn-sm" onclick="toggleUser(' +
                Number(u.user_id) +
                ')">Approve</button>';
            } else if (currentTab === "active") {
              badge = '<span class="status-badge status-active">Active</span>';
              actionBtn =
                '<button class="btn btn-danger btn-sm" onclick="toggleUser(' +
                Number(u.user_id) +
                ')">Deactivate</button>';
            } else {
              badge = '<span class="status-badge status-active">Customer</span>';
            }

            const company = u.company_name
              ? '<p class="company">' + escapeHtml(u.company_name) + "</p>"
              : "";

            return (
              '<div class="user-card">' +
                '<div class="user-info">' +
                  "<h4>" + escapeHtml(u.name) + " " + badge + "</h4>" +
                  "<p>" + escapeHtml(u.email) + " · " +
                    escapeHtml(u.phone_number || "No phone") + "</p>" +
                  company +
                "</div>" +
                (actionBtn ? "<div>" + actionBtn + "</div>" : "") +
              "</div>"
            );
          }).join("");
        } catch (err) {
          listContainer.innerHTML =
            '<p class="empty-text" style="color:var(--red);">Error loading data.</p>';
        }
      }

      window.toggleUser = async function (id) {
        if (!confirm("Are you sure you want to change this user's status?")) return;

        try {
          const res = await fetch("/admin/users/" + id + "/toggle-active", {
            method: "PATCH",
            headers: { Authorization: "Bearer " + token },
          });

          if (res.ok) {
            setMsg("User status updated successfully!", "var(--green)");
            loadData();
          } else {
            let detail = "Failed to update user.";
            try {
              const err = await res.json();
              if (err && typeof err.detail === "string") detail = err.detail;
            } catch (_) { /* ignore */ }
            setMsg(detail, "var(--red)");
          }
        } catch (err) {
          setMsg("Network error.", "var(--red)");
        }
      };

      loadData();
    })();
  </script>
</body>
</html>
