services:
  - type: web
    name: builder-wood-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m builder_wood.seed && uvicorn builder_wood.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: BASE_URL
        value: https://builder-wood-2.onrender.com

  - type: cron
    name: settle-orders
    runtime: python
    plan: free
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m builder_wood.scripts.settle_eligible
    envVars:
      - fromService:
          type: web
          name: builder-wood-api
          envVarKey: PAYSTACK_SECRET_KEY
      - fromService:
          type: web
          name: builder-wood-api
          envVarKey: BASE_URL