services:
  - type: web
    name: builder-wood-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn builder_wood.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PAYSTACK_SECRET_KEY
        sync: false # This tells Render to ask you for the value in the dashboard
      - key: BASE_URL
        value: https://builder-wood-api.onrender.com # We will update this after deployment