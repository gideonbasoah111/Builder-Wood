services:
  - type: web
    name: builder-wood-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m builder_wood.seed && uvicorn builder_wood.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: BASE_URL
        value: https://builder-wood-api.onrender.com